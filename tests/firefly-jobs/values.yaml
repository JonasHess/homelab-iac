# Minimum needed to render apps/firefly-importer. Every job is switched on so the
# rendered ConfigMaps exist to be checked; nothing here reaches a cluster.
generic:
  appName: firefly-importer
  deployment:
    pvcMounts:
      import:
        hostPath: /tmp/firefly-import
      import-jobs:
        hostPath: /tmp/firefly-import-jobs
digest:
  enabled: true
loanSplit:
  enabled: true
  loans:
    - label: Example
      payee: 1
      liability: 2
      interest: 3
ledgerCheck:
  enabled: true
  loanPayees: [1, 2]
  ignorePayeeIds: [3]
syncConsent:
  enabled: true
linkTransfers:
  enabled: true
  soleSourceAccounts: [257]
trTimeline:
  enabled: true
  credentialsSecret: example-credentials
  sessionClaim: example-session
  cashAccount: 1
  depotAccount: 2
