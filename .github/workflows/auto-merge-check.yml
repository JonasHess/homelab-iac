name: Auto-merge Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # The deploy PR from restic-image.yml merges itself and needs no check.
    paths-ignore:
      - 'apps/restic/values.yaml'

jobs:
  auto-merge-check:
    name: Enable Auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Simple check
        run: |
          echo "✅ This check enables auto-merge functionality"
          echo "PR #${{ github.event.number }} is ready"
          exit 0