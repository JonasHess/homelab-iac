name: Build and Push Restic Docker Image

on:
  push:
    branches:
      - main
    # Only what the image is built from. Chart, template and values changes deploy
    # through ArgoCD; rebuilding for them pushes an identical script and opens a
    # deploy PR that changes nothing.
    paths:
      - 'apps/restic/Dockerfile'
      - 'apps/restic/assets/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The last step opens a PR that points apps/restic/values.yaml at the new image.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The script decides the exit code the BackupTooOld alert relies on, so an image
      # is only built from a script whose tests pass.
      - uses: actions/setup-python@v7
        with:
          # Keep this in step with the Dockerfile's base image.
          # Renovate moves this in the same PR as the python image tags (same
          # depName), so a version setup-python cannot install yet fails CI and
          # holds back the image bump too.
          # renovate: datasource=docker depName=python
          python-version: '3.15'

      - name: Run the unit tests
        env:
          # renovate: datasource=pypi depName=pytest
          PYTEST_VERSION: 9.2.0
        run: |
          pip install --quiet "pytest==${PYTEST_VERSION}" -r apps/restic/assets/requirements.txt
          python -m pytest -q tests/restic

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: homelab-iac/restic
          IMAGE_TAG_LATEST: latest
          IMAGE_TAG_SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          cd apps/restic
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LATEST .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_SHA .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LATEST
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_SHA
          echo "Pushed images:"
          echo "  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LATEST"
          echo "  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_SHA"

      # Renovate cannot see private ECR images, so the deployed tag is bumped here instead.
      # Merging this PR does not rebuild the image: values.yaml is not in the trigger paths.
      # Needs "Allow GitHub Actions to create and approve pull requests" in the repo settings.
      - name: Open a PR that deploys the new image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/homelab-iac/restic:${{ steps.vars.outputs.sha_short }}
          SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          branch="restic-image-${SHA}"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $branch already open, nothing to do"
            exit 0
          fi
          sed -i -E "s|^(\s*image:\s*)\S+/homelab-iac/restic:\S+|\1${IMAGE}|" apps/restic/values.yaml
          if git diff --quiet -- apps/restic/values.yaml; then
            echo "apps/restic/values.yaml already deploys ${IMAGE}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore: Update restic image to ${SHA}" -- apps/restic/values.yaml
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: Update restic image to ${SHA}" \
            --body "Deploys \`${IMAGE}\`, built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA} by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
