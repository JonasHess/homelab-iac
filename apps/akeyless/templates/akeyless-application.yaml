apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: {{ $.Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 2.14.0
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Release.Namespace }}
  syncPolicy:
    # selfHeal resets manual changes to the operator. No prune: the chart ships the
    # CRDs, and pruning a CRD a new chart version drops would delete every
    # ExternalSecret of that kind, and with them the refresh of all Secrets.
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # Policy shared by every Application: global.argocd.retry in base-chart/values.yaml.
    retry:
      {{- toYaml (required "global.argocd.retry must be set" $.Values.global.argocd.retry) | nindent 6 }}
