# Single sign-on via a Firefly-scoped SecurityPolicy (see
# templates/firefly-sso-securitypolicy.yaml). It validates the Cognito ID token
# out of the session cookie and copies the `email` claim into X-Auth-Email.
#   enabled           - install the Firefly-scoped OIDC + JWT SecurityPolicy.
#   enforceRemoteUser - switch Firefly to remote_user_guard so it trusts the
#                       X-Auth-Email header (password-less login). Set to false
#                       to fall back to Firefly's own login form.
#   allowedGroups     - Cognito groups permitted to reach Firefly, matched
#                       against the `cognito:groups` claim; a user needs ANY one
#                       of them. Empty list = every authenticated Cognito user,
#                       i.e. no authorization at all.
#                       This is the only access gate Firefly has: under
#                       remote_user_guard it auto-creates an account for any
#                       email it is handed (no way to disable that) and ignores
#                       its own `blocked` flag. Set this per environment.
sso:
  enabled: true
  enforceRemoteUser: true
  allowedGroups: []

generic:
  externalSecrets:
    firefly-secret:
      - APP_KEY: "/firefly/APP_KEY"
      - DB_PASSWORD: "/firefly/DB_PASSWORD"
      - STATIC_CRON_TOKEN: "/firefly/STATIC_CRON_TOKEN"
  deployment:
    image: fireflyiii/core:version-6.6.6
    ports:
      - containerPort: 8080
    pvcMounts:
      upload:
        mountPath: /var/www/html/storage/upload
        hostPath:   # set in the environment overlay, e.g. /mnt/tank1/encrypted/apps/firefly/upload
        backup:
          enabled: true
    envFrom:
      configMapRef: firefly-config
      secretRef: firefly-secret
  service:
    ports:
      - name: http
        port: 8080
  ingress:
    https:
      - subdomain: firefly
        port: 8080
        oauth: true
