{{- /*
  Alert rules live with the app, alongside the ServiceMonitor whose metrics they
  read - the metric and the alert cannot be enabled separately. These back up the
  app's own ntfy/email alerts: if the app is down or cannot notify, Prometheus
  still catches the failure.

  Every expression is scoped to this instance's `service` label. Both tenant
  instances expose the same venice_autobook_* metric names, so without the scope an
  unhealthy Pfitzenmeier instance would also trip the venice-autobook alerts and
  vice versa.
*/}}
{{- if (.Values.global.monitoring | default dict).enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: venice-autobook-pfitzenmeier-alerts
  namespace: {{ $.Release.Namespace }}
  labels:
    app: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    # The label Prometheus' ruleSelector matches on; without it the rules never load.
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  groups:
  - name: venice-autobook-pfitzenmeier-alerts
    interval: 1m
    rules:
    - alert: VeniceAutobookPfitzenmeierLoginBroken
      annotations:
        summary: "venice-autobook (Pfitzenmeier) cannot log in to the studio"
        description: "venice_autobook_auth_ok has been 0 for 15m: authentication to the Pfitzenmeier studio is failing, so no class will be booked until the credentials are fixed (check /zimmermann.lat/venice-autobook-pfitzenmeier/VB_PASSWORD, or a changed password / new 2FA)."
      expr: venice_autobook_auth_ok{service="venice-autobook-pfitzenmeier-service"} == 0
      for: 15m
      labels:
        severity: critical
    - alert: VeniceAutobookPfitzenmeierSyncStale
      annotations:
        summary: "venice-autobook (Pfitzenmeier) has not synced the class plan recently"
        description: "No successful schedule sync in over an hour. Upcoming classes may not be armed - check the pod and the studio API."
      expr: venice_autobook_last_sync_timestamp_seconds{service="venice-autobook-pfitzenmeier-service"} > 0
        and (time() - venice_autobook_last_sync_timestamp_seconds{service="venice-autobook-pfitzenmeier-service"}) > 3600
      for: 15m
      labels:
        severity: warning
    - alert: VeniceAutobookPfitzenmeierMissedBooking
      annotations:
        summary: "venice-autobook (Pfitzenmeier) missed a booking window"
        description: "A class booking window passed without a booking (the service was likely down at the fire moment). The seat was not taken."
      expr: increase(venice_autobook_outcomes_total{result="missed",service="venice-autobook-pfitzenmeier-service"}[1h]) > 0
      labels:
        severity: critical
    - alert: VeniceAutobookPfitzenmeierBookingFailed
      annotations:
        summary: "venice-autobook (Pfitzenmeier) failed to book a class"
        description: "A booking attempt failed (full without a waitlist, or an API error). Check the app's activity log."
      expr: increase(venice_autobook_outcomes_total{result="failed",service="venice-autobook-pfitzenmeier-service"}[1h]) > 0
      labels:
        severity: warning
    - alert: VeniceAutobookPfitzenmeierTargetDown
      annotations:
        summary: "venice-autobook (Pfitzenmeier) is not being scraped"
        description: "Prometheus has not been able to scrape venice-autobook-pfitzenmeier /metrics for 15m - the pod may be down, which means bookings will be missed."
      expr: absent(venice_autobook_auth_ok{service="venice-autobook-pfitzenmeier-service"})
      for: 15m
      labels:
        severity: critical
{{- end }}
