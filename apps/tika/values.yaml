generic:
  deployment:
    image: docker.io/apache/tika:3.3.3.0
    # Requests only, sized from measured usage, so this pod is among the last
    # to be evicted under memory pressure. No limit: it is Java, which sizes its heap from the memory limit.
    resources:
      requests:
        memory: "512Mi"
        cpu: "10m"
    ports:
    - containerPort: 9998
  service:
    ports:
    - name: tika
      port: 9998
