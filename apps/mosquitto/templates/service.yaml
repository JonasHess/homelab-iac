{{- /* NodePort exposes the broker on the node's LAN address for devices outside
       the cluster; ClusterIP keeps it cluster-internal. */ -}}
{{- $type := .Values.service.type | default "NodePort" }}
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: {{ $.Release.Namespace }}
spec:
  ports:
  - name: tcp1883
    port: 1883
    targetPort: 1883
    {{- if eq $type "NodePort" }}
    nodePort: 31883
    {{- end }}
  selector:
    app: mosquitto
  type: {{ $type }}
