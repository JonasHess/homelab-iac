{{- /*
  Route-scoped SSO + group authorization for firefly-sankey. This SecurityPolicy
  fully REPLACES the Gateway-level `gateway-oidc` policy for Sankey's HTTPRoute
  only — every other app keeps the shared gateway session untouched.

  Sankey authenticates to Firefly with a single Personal Access Token, so it has
  no user concept at all: whoever opens it sees the entire ledger. The
  `cognito:groups` check below is the only thing between an authenticated
  household member and those finances.

  The shared gateway session is unusable for authorization here — its cookies are
  encrypted and belong to a different filter instance — so this policy runs its
  own OIDC filter, scoped to Sankey:
    - disableTokenEncryption: store the raw JWT in the cookie so jwt can parse it
    - refreshToken:           keep the ID token fresh so the cookie never holds an
                              expired token (which jwt would reject with 401)
    - cookieNames:            host-only, uniquely named -> isolated from the
                              gateway-oidc *.<domain> cookies, so other apps'
                              sessions are never touched

  Own callback on Sankey's own host: the shared auth.<domain> callback is owned by
  the gateway-oidc filter and fails CSRF for a separate filter instance.
  https://sankey.<domain>/oauth2/callback must be whitelisted in Cognito.

  Envoy orders the filters oauth2 (8) -> jwt (9) -> rbac (301), so a request
  without a session is redirected to Cognito long before the deny rule is
  evaluated; the deny only ever hits signed-in users who lack the group.
*/ -}}
{{- if .Values.sso.enabled }}
{{- $oidc := required "global.oidc must be set" .Values.global.oidc }}
{{- $issuer := required "global.oidc.issuerUrl must be set" $oidc.issuerUrl }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: firefly-sankey-sso
  namespace: {{ required "global.gateway.namespace must be set" .Values.global.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=true,SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: firefly-sankey-https-8080-0
  oidc:
    provider:
      issuer: {{ $issuer | quote }}
    clientID: {{ required "global.oidc.clientId must be set" $oidc.clientId | quote }}
    clientSecret:
      name: oidc-client-secret
    redirectURL: "https://sankey.{{ .Values.global.domain }}/oauth2/callback"
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
    cookieNames:
      idToken: "SankeyIdToken"
      accessToken: "SankeyAccessToken"
    disableTokenEncryption: true
    refreshToken: true
  jwt:
    optional: true
    providers:
      - name: cognito
        issuer: {{ $issuer | quote }}
        audiences:
          - {{ required "global.oidc.clientId must be set" $oidc.clientId | quote }}
        remoteJWKS:
          uri: "{{ $issuer }}/.well-known/jwks.json"
        extractFrom:
          cookies:
            - SankeyIdToken
  {{- with .Values.sso.allowedGroups }}
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-groups
        action: Allow
        principal:
          jwt:
            provider: cognito
            claims:
              - name: "cognito:groups"
                valueType: StringArray
                values:
{{- toYaml . | nindent 18 }}
  {{- end }}
{{- end }}
