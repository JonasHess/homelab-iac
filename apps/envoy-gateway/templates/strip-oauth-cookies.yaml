{{- /*
  Strip the Envoy OAuth2 filter's cookies from the Cookie header before the
  request reaches the upstream pod. Pods don't need IdToken/AccessToken/etc.
  — Envoy validates them locally — and these cookies are large enough to
  bust Node.js (16 KB) and Tomcat (~8 KB) default header limits, producing
  HTTP 431.

  Attached to the Gateway so every route inherits the stripper. The Lua only
  touches the request path and doesn't depend on filter ordering or any
  inter-phase state, so it's robust to Envoy Gateway upgrades.
*/ -}}
{{- $oidc := required "global.oidc must be set" .Values.global.oidc }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: strip-oauth-cookies
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
  lua:
    - type: Inline
      inline: |
        -- Cookie names set by Envoy's OAuth2 filter, in two flavours.
        -- Exact names: the ones a SecurityPolicy pins itself — the Gateway's
        -- ID/access token cookies and the Firefly-scoped policy's.
        local STRIP = {
          {{ required "global.oidc.idTokenCookieName must be set" $oidc.idTokenCookieName }}     = true,
          {{ required "global.oidc.accessTokenCookieName must be set" $oidc.accessTokenCookieName }} = true,
          FireflyIdToken     = true,
          FireflyAccessToken = true,
        }
        -- Prefixed names: everything a policy cannot rename. Envoy Gateway
        -- appends a digest of the policy UID, e.g. "RefreshToken-a1b2c3".
        -- Matching on "<base>-" keeps app cookies that merely start with the
        -- same word.
        local STRIP_PREFIXES = {
          "IdToken", "AccessToken", "BearerToken", "RefreshToken",
          "OauthHMAC", "OauthExpires", "OauthNonce", "CodeVerifier",
        }

        local function is_oauth_cookie(name)
          if STRIP[name] then return true end
          for _, base in ipairs(STRIP_PREFIXES) do
            if name == base or name:sub(1, #base + 1) == base .. "-" then
              return true
            end
          end
          return false
        end

        local function trim(s)
          return (s:gsub("^%s*(.-)%s*$", "%1"))
        end

        function envoy_on_request(req)
          local cookie = req:headers():get("cookie")
          if not cookie then return end
          local kept = {}
          for piece in string.gmatch(cookie, "([^;]+)") do
            local p = trim(piece)
            local name = p:match("^([^=]+)")
            if name and not is_oauth_cookie(trim(name)) then
              kept[#kept + 1] = p
            end
          end
          if #kept == 0 then
            req:headers():remove("cookie")
          else
            req:headers():replace("cookie", table.concat(kept, "; "))
          end
        end
