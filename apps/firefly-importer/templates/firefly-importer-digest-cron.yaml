{{- if .Values.digest.enabled }}
{{- /*
  Post-import digest. The Data Importer's own report lists every rejected line,
  and because the bank re-offers a rolling window every night, that is ~100
  "already exists" entries daily - a genuine failure is invisible in it. Worse,
  a run that aborts early (expired bank consent) sends no report at all, so the
  failure mode that matters produces silence.

  This job asks the opposite question: did each account actually receive data?
  An account whose newest transaction is older than staleDays is reported,
  which catches a broken connection regardless of why it broke.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
rules:
  # Read-only, namespace-scoped: find the importer pod and read its log, so the
  # digest can report runs that never produced a report of their own.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firefly-importer-digest
subjects:
  - kind: ServiceAccount
    name: firefly-importer-digest
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-importer-digest-script
  namespace: {{ .Release.Namespace }}
data:
  digest.py: |
    import json, os, re, ssl, smtplib, urllib.request, datetime
    from email.message import EmailMessage

    BASE  = os.environ["FIREFLY_III_URL"].rstrip("/")
    TOKEN = os.environ["FIREFLY_III_ACCESS_TOKEN"]
    STALE = int(os.environ.get("DIGEST_STALE_DAYS", "3"))      # absolute floor
    MULT  = int(os.environ.get("DIGEST_STALE_MULTIPLIER", "4")) # x the account's median gap
    LOG_SECONDS = int(os.environ.get("DIGEST_LOG_SECONDS", "43200"))  # log window to scan (12h)
    # Accounts that legitimately go quiet (manually maintained, dormant). Without
    # this they would trip the staleness check every single night, and a warning
    # that fires every night is one nobody reads.
    IGNORE = set(json.loads(os.environ.get("DIGEST_IGNORE_STALE", "[]")))
    ALWAYS = os.environ.get("DIGEST_ALWAYS_SEND", "false").lower() == "true"
    WINDOW= int(os.environ.get("DIGEST_WINDOW_HOURS", "24"))

    def api(path):
        req = urllib.request.Request(
            BASE + path,
            headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/json"})
        with urllib.request.urlopen(req, timeout=60) as r:
            return json.load(r)

    today = datetime.date.today()
    since = today - datetime.timedelta(days=max(1, WINDOW // 24))

    # New transactions in the window, counted per asset account.
    fresh = {}
    page = 1
    while True:
        d = api(f"/api/v1/transactions?start={since}&end={today}&limit=500&page={page}")
        for t in d["data"]:
            for s in t["attributes"]["transactions"]:
                for side in ("source", "destination"):
                    if s.get(f"{side}_type") == "Asset account":
                        fresh[s[f"{side}_name"]] = fresh.get(s[f"{side}_name"], 0) + 1
        if page >= max(1, d["meta"]["pagination"]["total_pages"]):
            break
        page += 1

    # A fixed "silent for N days" rule is useless here: PSD sees traffic daily,
    # the rental accounts a few times a month, SpaceX never. So each account is
    # judged against its OWN rhythm - the median gap between its transactions -
    # and only flagged when the current silence is several times that.
    def rhythm(aid):
        d = api(f"/api/v1/accounts/{aid}/transactions?limit=60")
        ds = sorted({s["date"][:10] for t in d["data"] for s in t["attributes"]["transactions"]})
        if len(ds) < 6:
            return None                       # too little history to judge
        dts  = [datetime.date.fromisoformat(x) for x in ds]
        gaps = sorted((dts[i+1] - dts[i]).days for i in range(len(dts)-1))
        return max(1, gaps[len(gaps)//2])     # median gap in days

    rows, stale = [], []
    for a in api("/api/v1/accounts?type=asset&limit=200")["data"]:
        at = a["attributes"]
        if not at.get("active"):
            continue
        last = (at.get("last_activity") or "")[:10]
        age  = (today - datetime.date.fromisoformat(last)).days if last else None
        n    = fresh.get(at["name"], 0)
        rows.append((at["name"], n, last or "-", age))
        if age is None or at["name"] in IGNORE:
            continue
        med = rhythm(a["id"])
        if med is None:
            continue
        limit = max(STALE, MULT * med)
        if age > limit:
            stale.append((at["name"], last, age, med, limit))

    rows.sort(key=lambda r: (-r[1], r[0]))
    # Deliberately no balances: this mail answers "did the import run?", and
    # account balances do not belong in a daily plaintext notification.
    w = max([len(r[0]) for r in rows] + [7])
    lines = [f"{'Account'.ljust(w)}  {'new':>4}  {'last activity':>13}",
             "-" * (w + 22)]
    lines += [f"{r[0].ljust(w)}  {r[1]:>4}  {r[2]:>13}" for r in rows]

    # --- what the importer itself did last run -------------------------------
    # The digest can only see what arrived. A run that aborts (expired consent) or
    # a line rejected for a real reason leaves no trace in the data, so read the
    # importer's log too and keep only what is NOT routine duplicate noise:
    # a115 = "already exists" (external_id), a117 = same by content. Both expected
    # every night because the bank re-offers a rolling window.
    attempted, finished, real_errors = [], [], []
    try:
        sa   = "/var/run/secrets/kubernetes.io/serviceaccount"
        ns   = open(f"{sa}/namespace").read().strip()
        ktok = open(f"{sa}/token").read().strip()
        ctx  = ssl.create_default_context(cafile=f"{sa}/ca.crt")
        # Python 3.13 enables VERIFY_X509_STRICT, which rejects the cluster CA because
        # it carries no keyUsage extension. Drop just that check - the certificate is
        # still verified against the cluster CA, we are not disabling verification.
        ctx.verify_flags &= ~ssl.VERIFY_X509_STRICT
        def k8s(path):
            r = urllib.request.Request("https://kubernetes.default.svc" + path,
                                       headers={"Authorization": "Bearer " + ktok})
            with urllib.request.urlopen(r, context=ctx, timeout=30) as resp:
                return resp.read().decode("utf-8", "replace")
        # NB the digest's own pod carries app=firefly-importer too, so filter on the
        # deployment's name; picking by label alone reads this job's own (empty) log.
        pods = json.loads(k8s(f"/api/v1/namespaces/{ns}/pods?labelSelector=app%3Dfirefly-importer"))
        name = next(p["metadata"]["name"] for p in pods["items"]
                    if p["status"]["phase"] == "Running"
                    and p["metadata"]["name"].startswith("firefly-importer-deployment"))
        # The Enable Banking debug dumps are enormous, so a line cap can miss the run
        # entirely; take everything since shortly before the import instead.
        log  = k8s(f"/api/v1/namespaces/{ns}/pods/{name}/log?sinceSeconds={LOG_SECONDS}")
        for ln in log.splitlines():
            m = re.search(r'importable "/import/([^"]+)"', ln)
            if m: attempted.append(m.group(1))
            m = re.search(r'Created event ImportedTransactions\("([^"]+)"\)', ln)
            if m: finished.append(m.group(1))
            if "production.ERROR" in ln and "[a115]" not in ln and "[a117]" not in ln \
               and "Exit code is GENERAL_ERROR" not in ln:
                real_errors.append(re.sub(r"^\[[^\]]+\] production.ERROR: ", "", ln).strip()[:180])
    except Exception as e:                       # never let monitoring break the digest
        real_errors.append(f"(could not read importer log: {e})")

    aborted = [c for c in dict.fromkeys(attempted) if c not in finished]
    # A pod restart between the import and this job wipes the log, and "no errors
    # found" would then be a lie. Say so instead of implying everything is fine.
    if not attempted and not real_errors:
        real_errors.append("no import run found in the importer log "
                           "(pod restarted since the import?) - could not verify the run")
    # collapse repeats, keep order
    real_errors = list(dict.fromkeys(real_errors))[:12]

    subject = f"Firefly import digest {today} - {sum(r[1] for r in rows)} new"
    # Zero new transactions is NOT an alarm on its own - a quiet weekend looks
    # identical to a broken importer. The per-account staleness check below is the
    # reliable signal, so this is only reported as context when we mail anyway.
    bits = []
    if aborted:     bits.append(f"{len(aborted)} import(s) failed")
    if real_errors: bits.append(f"{len(real_errors)} error(s)")
    if stale:       bits.append(f"{len(stale)} stale")
    if bits:
        subject = "[!] " + subject + " - " + ", ".join(bits)
        lines += [""]
        if aborted:
            lines += ["Import did NOT complete for:"] + [f"  - {c}" for c in aborted]
        if real_errors:
            lines += ["", "Errors (duplicate rejections excluded):"] + [f"  - {e}" for e in real_errors]
        if stale:
            lines += ["", "Silent far longer than usual - check the bank connection:"]
            lines += [f"  - {n}: last {d}, {a} days ago (usually every {m}d, flags above {l}d)"
                      for n, d, a, m, l in stale]

    if not bits and not ALWAYS:
        print("nothing to report - no mail sent")
        print("\n".join(lines))
        raise SystemExit(0)

    msg = EmailMessage()
    msg["Subject"] = subject
    msg["From"]    = f"{os.environ.get('MAIL_FROM_NAME','Firefly')} <{os.environ['MAIL_FROM_ADDRESS']}>"
    msg["To"]      = os.environ["MAIL_DESTINATION"]
    msg.set_content("\n".join(lines))

    with smtplib.SMTP(os.environ["MAIL_HOST"], int(os.environ.get("MAIL_PORT", "587")), timeout=30) as s:
        if os.environ.get("MAIL_ENCRYPTION", "tls") == "tls":
            s.starttls()
        s.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
        s.send_message(msg)
    print(subject)
    print()
    print("\n".join(lines))
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
  labels:
    app: firefly-importer
    component: digest
spec:
  schedule: {{ .Values.digest.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: firefly-importer
            component: digest
        spec:
          restartPolicy: OnFailure
          serviceAccountName: firefly-importer-digest
          containers:
            - name: digest
              image: {{ .Values.digest.image | quote }}
              envFrom:
                - configMapRef:
                    name: firefly-importer-config
                - secretRef:
                    name: firefly-importer-secret
              env:
                - name: DIGEST_STALE_DAYS
                  value: {{ .Values.digest.staleDays | quote }}
                - name: DIGEST_STALE_MULTIPLIER
                  value: {{ .Values.digest.staleMultiplier | quote }}
                - name: DIGEST_LOG_SECONDS
                  value: {{ .Values.digest.logSeconds | quote }}
                - name: DIGEST_IGNORE_STALE
                  value: {{ .Values.digest.ignoreStale | toJson | quote }}
                - name: DIGEST_ALWAYS_SEND
                  value: {{ .Values.digest.alwaysSend | quote }}
              command: ["python3", "/script/digest.py"]
              volumeMounts:
                - name: script
                  mountPath: /script
          volumes:
            - name: script
              configMap:
                name: firefly-importer-digest-script
{{- end }}
