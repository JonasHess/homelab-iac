{{- if .Values.digest.enabled }}
{{- /*
  Post-import digest. The Data Importer's own report lists every rejected line,
  and because the bank re-offers a rolling window every night, that is ~100
  "already exists" entries daily - a genuine failure is invisible in it. Worse,
  a run that aborts early (expired bank consent) sends no report at all, so the
  failure mode that matters produces silence.

  This job asks the opposite question: did each account actually receive data?
  An account whose newest transaction is older than staleDays is reported,
  which catches a broken connection regardless of why it broke.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
rules:
  # Read-only, namespace-scoped: find tonight's auto-import pod and read its log,
  # so the digest can report runs that never produced a report of their own.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firefly-importer-digest
subjects:
  - kind: ServiceAccount
    name: firefly-importer-digest
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-importer-digest-script
  namespace: {{ .Release.Namespace }}
data:
  digest.py: |
{{ .Files.Get "scripts/digest.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-importer-digest
  namespace: {{ .Release.Namespace }}
  labels:
    app: firefly-importer
    component: digest
spec:
  schedule: {{ .Values.digest.schedule | quote }}
  concurrencyPolicy: Forbid
  # A week of runs, because this job's pod log IS the mail it sent: with three,
  # a Monday question about Thursday's digest has nothing left to read.
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: firefly-importer
            component: digest
        spec:
          restartPolicy: OnFailure
          serviceAccountName: firefly-importer-digest
          containers:
            - name: digest
              image: {{ .Values.digest.image | quote }}
              envFrom:
                - configMapRef:
                    name: firefly-importer-config
                - secretRef:
                    name: firefly-importer-secret
                {{- if .Values.digest.heartbeat.enabled }}
                - secretRef:
                    name: firefly-importer-digest-heartbeat
                {{- end }}
              env:
                - name: DIGEST_STALE_DAYS
                  value: {{ .Values.digest.staleDays | quote }}
                - name: DIGEST_STALE_MAX_DAYS
                  value: {{ .Values.digest.staleMaxDays | quote }}
                - name: DIGEST_STALE_MARGIN
                  value: {{ .Values.digest.staleMargin | quote }}
                - name: DIGEST_RUN_MAX_AGE_HOURS
                  value: {{ .Values.digest.runMaxAgeHours | quote }}
                - name: DIGEST_IGNORE_STALE
                  value: {{ .Values.digest.ignoreStale | toJson | quote }}
                - name: DIGEST_ALWAYS_SEND
                  value: {{ .Values.digest.alwaysSend | quote }}
              command: ["python3", "/script/digest.py"]
              volumeMounts:
                - name: script
                  mountPath: /script
          volumes:
            - name: script
              configMap:
                name: firefly-importer-digest-script
{{- end }}
