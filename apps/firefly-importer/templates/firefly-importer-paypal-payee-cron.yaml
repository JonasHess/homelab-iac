{{- if .Values.paypalPayee.enabled }}
{{- /*
  Names the merchant behind each PayPal payment as its payee.

  Every PayPal debit is imported as a withdrawal to "PayPal Europe ...", so a fifth of
  the household's spending shows up under one payee and no report can say where it
  went. The bank's description names the merchant; this job copies it into the payee.
  It changes nothing else - amount, date and category stay as imported and as rules or
  people set them.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-importer-paypal-payee-script
  namespace: {{ .Release.Namespace }}
data:
  paypal_payee.py: |
{{ .Files.Get "scripts/paypal_payee.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-importer-paypal-payee
  namespace: {{ .Release.Namespace }}
  labels:
    app: firefly-importer-paypal-payee
    component: paypal-payee
spec:
  schedule: {{ .Values.paypalPayee.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: firefly-importer-paypal-payee
            component: paypal-payee
        spec:
          restartPolicy: OnFailure
          containers:
            - name: paypal-payee
              image: {{ .Values.paypalPayee.image | quote }}
              envFrom:
                - configMapRef:
                    name: firefly-importer-config
                - secretRef:
                    name: firefly-importer-secret
              env:
                - name: PAYPAL_PAYEE_WINDOW_DAYS
                  value: {{ .Values.paypalPayee.windowDays | quote }}
                - name: PAYPAL_PAYEE_DRY_RUN
                  value: {{ .Values.paypalPayee.dryRun | quote }}
              command: ["python3", "/script/paypal_payee.py"]
              volumeMounts:
                - name: script
                  mountPath: /script
          volumes:
            - name: script
              configMap:
                name: firefly-importer-paypal-payee-script
{{- end }}
