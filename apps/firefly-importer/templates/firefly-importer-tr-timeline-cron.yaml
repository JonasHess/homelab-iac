{{- if .Values.trTimeline.enabled }}
{{- $ns := .Values.trTimeline.namespace | default .Release.Namespace }}
{{- $tr := .Values.trTimeline }}
{{- $accounts := list }}
{{- if $tr.cashAccount }}
{{- $accounts = append $accounts (pick $tr "credentialsSecret" "sessionClaim" "cashAccount" "depotAccount" "assetAccounts") }}
{{- end }}
{{- $accounts = concat $accounts ($tr.accounts | default list) }}
{{- /*
  Books new Trade Republic transactions from the broker's timeline, fetched with pytr.

  It runs on the web session the pytr chart's login job saved and never logs in itself:
  a login sends a code to the phone and waits for it to be typed in. That session lives
  24 hours from the login and refreshing does not extend it, so the login job starts this
  job right after a login, and the nightly run only catches up within that day. An
  expired session is the normal state: it books nothing, and mails the login steps only
  once no import has succeeded for remindAfterDays.

  Movements to and from your own bank accounts are left to the bank import, and
  link-transfers turns them into transfers; booking them here too would count them twice.

  One CronJob per TR account. Each runs on its own pytr session volume, which also holds
  its reminder stamps, so the accounts share nothing but the script and the Firefly token.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-importer-tr-timeline-script
  namespace: {{ $ns }}
data:
  tr_timeline.py: |
{{ .Files.Get "scripts/tr_timeline.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-importer-tr-config
  namespace: {{ $ns }}
data:
  FIREFLY_III_URL: "http://firefly-service.{{ .Release.Namespace }}.svc.cluster.local:8080"
{{- if .Values.smtp.enabled }}
  MAIL_HOST: {{ .Values.smtp.host | quote }}
  MAIL_PORT: {{ .Values.smtp.port | quote }}
  MAIL_ENCRYPTION: {{ .Values.smtp.encryption | quote }}
  MAIL_USERNAME: {{ .Values.smtp.username | quote }}
  MAIL_FROM_ADDRESS: {{ .Values.smtp.from | quote }}
  MAIL_FROM_NAME: {{ .Values.smtp.fromName | quote }}
  MAIL_DESTINATION: {{ .Values.smtp.destination | quote }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-importer-tr-secret-external-secret
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=true,SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.global.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.global.externalSecrets.clusterSecretStoreRef.name }}
  target:
    name: firefly-importer-tr-secret
    creationPolicy: Owner
  data:
    - secretKey: FIREFLY_III_ACCESS_TOKEN
      remoteRef:
        key: "{{ .Values.global.akeyless.path }}/firefly/IMPORTER_ACCESS_TOKEN"
{{- if .Values.smtp.enabled }}
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: "{{ .Values.global.akeyless.path }}/firefly/MAIL_PASSWORD"
{{- end }}
{{- with .Values.trTimeline.aliasPath }}
    - secretKey: TR_NAME_ALIAS
      remoteRef:
        key: "{{ $.Values.global.akeyless.path }}{{ . }}"
{{- end }}
{{- range $a := $accounts }}
{{- $name := printf "firefly-importer-tr-timeline%s" (ternary (printf "-%s" ($a.name | default "")) "" (not (empty $a.name))) }}
{{- $set := dict }}
{{- range $k := list "windowDays" "dryRun" "remindAfterDays" "loginHint" }}
{{- $_ := set $set $k (ternary (get $a $k) (get $tr $k) (hasKey $a $k)) }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: firefly-importer
    component: tr-timeline
spec:
  # Before link-transfers, the digest and the ledger check, so all three see tonight's
  # TR rows.
  schedule: {{ $tr.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry: a failed run is reported by mail, and hammering the broker's API
      # again within minutes gains nothing.
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: firefly-importer
            component: tr-timeline
        spec:
          restartPolicy: Never
          containers:
            - name: tr-timeline
              image: {{ $tr.image | quote }}
              envFrom:
                - configMapRef:
                    name: firefly-importer-tr-config
                - secretRef:
                    name: firefly-importer-tr-secret
                - secretRef:
                    name: {{ required "trTimeline credentialsSecret is required" $a.credentialsSecret }}
              env:
                - name: HOME
                  value: /home/pytr
                - name: TR_CASH_ACCOUNT
                  value: {{ required "trTimeline cashAccount is required" $a.cashAccount | quote }}
                - name: TR_DEPOT_ACCOUNT
                  value: {{ required "trTimeline depotAccount is required" $a.depotAccount | quote }}
                - name: TR_ASSET_ACCOUNTS
                  value: {{ $a.assetAccounts | default dict | toJson | quote }}
                - name: TR_WINDOW_DAYS
                  value: {{ $set.windowDays | quote }}
                - name: TR_REMIND_AFTER_DAYS
                  value: {{ $set.remindAfterDays | quote }}
                - name: TR_DRY_RUN
                  value: {{ $set.dryRun | quote }}
                - name: TR_LOGIN_HINT
                  value: {{ $set.loginHint | quote }}
                - name: TR_ACCOUNT_LABEL
                  value: {{ $a.label | default "" | quote }}
              command: ["sh", "-c"]
              args:
                - |
                  pip install --quiet --root-user-action=ignore 'pytr=={{ $tr.pytrVersion }}' || exit 1
                  # pytr reads the phone number and PIN from this file and only saves the
                  # session when it exists. Kept in memory and removed afterwards, so the
                  # PIN never rests on the shared session volume.
                  printf '%s\n%s\n' "$PHONE_NUMBER" "$PIN" > /tmp/credentials
                  ln -sf /tmp/credentials /home/pytr/.pytr/credentials
                  python3 /script/tr_timeline.py
                  rc=$?
                  rm -f /home/pytr/.pytr/credentials
                  exit $rc
              volumeMounts:
                - name: script
                  mountPath: /script
                - name: session
                  mountPath: /home/pytr/.pytr
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: firefly-importer-tr-timeline-script
            # The pytr chart's volume: one session per TR account, shared with its login
            # and download jobs, which is why logging in there is all a re-login takes.
            - name: session
              persistentVolumeClaim:
                claimName: {{ required "trTimeline sessionClaim is required" $a.sessionClaim }}
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir:
                medium: Memory
{{- end }}
{{- end }}
