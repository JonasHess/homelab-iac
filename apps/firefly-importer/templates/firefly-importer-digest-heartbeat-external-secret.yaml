{{- if .Values.digest.heartbeat.enabled }}
{{- /*
  Ping URL for the digest's dead man's switch. It is a capability URL - anyone
  holding it can keep the check green and mask a dead importer - so it is kept
  out of Git and out of the shared firefly-importer-secret: a missing entry
  there would fail the sync of every other importer credential with it.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-importer-digest-heartbeat-external-secret
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=true,SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $.Values.global.externalSecrets.refreshInterval | default "1h" }}

  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.global.externalSecrets.clusterSecretStoreRef.name }}

  target:
    name: firefly-importer-digest-heartbeat
    creationPolicy: Owner

  data:
    - secretKey: "DIGEST_HEARTBEAT_URL"
      remoteRef:
        key: "{{ $.Values.global.akeyless.path }}/firefly/DIGEST_HEARTBEAT_URL"
{{- end }}
