generic:
  externalSecrets:
    firefly-importer-secret:
      - FIREFLY_III_ACCESS_TOKEN: "/firefly/IMPORTER_ACCESS_TOKEN"
      - ENABLE_BANKING_APP_ID: "/firefly/ENABLE_BANKING_APP_ID"
      - ENABLE_BANKING_PRIVATE_KEY: "/firefly/ENABLE_BANKING_PRIVATE_KEY"
      - AUTO_IMPORT_SECRET: "/firefly/AUTO_IMPORT_SECRET"
      # Own copy of the mailbox password rather than borrowing another app's:
      # a shared path would make this importer break when that app rotates it.
      # Only consumed when smtp.enabled is true; the Akeyless entry must exist
      # before rollout, otherwise the whole firefly-importer-secret fails to sync.
      - MAIL_PASSWORD: "/firefly/MAIL_PASSWORD"
  deployment:
    image: fireflyiii/data-importer:version-2.3.4
    ports:
      - containerPort: 8080
    # Persistent folder holding the downloaded import configuration JSON(s) that
    # the daily auto-import CronJob runs. hostPath is set in the environment overlay.
    pvcMounts:
      import:
        mountPath: /import
        hostPath:
    envFrom:
      configMapRef: firefly-importer-config
      secretRef: firefly-importer-secret
  service:
    ports:
      - name: http
        port: 8080
  ingress:
    https:
      - subdomain: firefly-importer
        port: 8080
        oauth: true
# Nightly import report. The importer builds a report after every /autoimport run
# but drops it unless a mailer is configured, so rejected transactions are visible
# only in the pod log - which is how duplicate imports went unnoticed for weeks.
# Setting destination is what actually delivers it.
smtp:
  enabled: false
  host: smtp.example.com
  port: 587
  encryption: tls
  username: firefly@example.com
  from: firefly@example.com
  fromName: Firefly III Data Importer
  destination: admin@example.com
  # The importer's own per-config report lists every rejected line (~100+/night, all
  # "already exists") and sends nothing at all when a run aborts. The digest below
  # covers both cases readably, so this stays off unless you want the raw detail.
  reportMail: false
# Post-import summary mail. Answers "did every account receive data?" rather than
# listing rejected lines, so a dead bank connection is visible even when the
# importer aborts before writing a report of its own. Reuses the smtp block above.
digest:
  enabled: false
  # 30 minutes after the auto-import, so it reports on that run.
  schedule: "30 4 * * *"
  image: python:3.13-slim
  # An account is flagged only when its silence exceeds BOTH this absolute floor
  # and staleMultiplier x its own median gap between transactions. A fixed day
  # count cannot work: some accounts move daily, others a few times a year.
  staleDays: 3
  staleMultiplier: 4
  # How far back to scan the importer log. Must comfortably cover the nightly run;
  # a line-count cap does not, because the Enable Banking debug output is huge.
  logSeconds: 43200
  # Mail only when something needs attention. A daily "all fine" message is the
  # fastest way to train yourself to ignore the one that matters.
  alwaysSend: false
  # Accounts that are not nightly-imported and would otherwise be flagged forever
  # (manually refreshed depots, closed cards). Exact account names.
  ignoreStale: []
