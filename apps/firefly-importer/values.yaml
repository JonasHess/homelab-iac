generic:
  externalSecrets:
    firefly-importer-secret:
      - FIREFLY_III_ACCESS_TOKEN: "/firefly/IMPORTER_ACCESS_TOKEN"
      - ENABLE_BANKING_APP_ID: "/firefly/ENABLE_BANKING_APP_ID"
      - ENABLE_BANKING_PRIVATE_KEY: "/firefly/ENABLE_BANKING_PRIVATE_KEY"
      - AUTO_IMPORT_SECRET: "/firefly/AUTO_IMPORT_SECRET"
      # Own copy of the mailbox password rather than borrowing another app's:
      # a shared path would make this importer break when that app rotates it.
      # Only consumed when smtp.enabled is true; the Akeyless entry must exist
      # before rollout, otherwise the whole firefly-importer-secret fails to sync.
      - MAIL_PASSWORD: "/firefly/MAIL_PASSWORD"
  deployment:
    image: fireflyiii/data-importer:version-2.3.4
    ports:
      - containerPort: 8080
    # Persistent folder holding the downloaded import configuration JSON(s) that
    # the daily auto-import CronJob runs. hostPath is set in the environment overlay.
    pvcMounts:
      import:
        mountPath: /import
        hostPath:
      # The wizard's own job files, which hold the only copy of a freshly authorised
      # bank consent. On the container filesystem they are lost on every restart, and
      # a restart between the SCA and the consent being carried over means doing the
      # SCA again. Persisted so no other pod has to race the importer for them.
      # The importer writes here as uid 33, so the host directory must be owned by it.
      import-jobs:
        mountPath: /var/www/html/storage/import-jobs
        hostPath:
    envFrom:
      configMapRef: firefly-importer-config
      secretRef: firefly-importer-secret
  service:
    ports:
      - name: http
        port: 8080
  ingress:
    https:
      - subdomain: firefly-importer
        port: 8080
        oauth: true
# Nightly import report. The importer builds a report after every /autoimport run
# but drops it unless a mailer is configured, so rejected transactions are visible
# only in the pod log - which is how duplicate imports went unnoticed for weeks.
# Setting destination is what actually delivers it.
smtp:
  enabled: false
  host: smtp.example.com
  port: 587
  encryption: tls
  username: firefly@example.com
  from: firefly@example.com
  fromName: Firefly III Data Importer
  destination: admin@example.com
  # The importer's own per-config report lists every rejected line (~100+/night, all
  # "already exists") and sends nothing at all when a run aborts. The digest below
  # covers both cases readably, so this stays off unless you want the raw detail.
  reportMail: false
# Post-import summary mail. Answers "did every account receive data?" rather than
# listing rejected lines, so a dead bank connection is visible even when the
# importer aborts before writing a report of its own. Reuses the smtp block above.
# Read-only nightly checks: own-account transfers imported as two halves, duplicate
# imports, and transactions no categorise rule matched. Silent unless one of them has
# something to report.
ledgerCheck:
  enabled: false
  # After the digest, so a night produces at most one mail from each job rather than
  # two interleaved ones.
  schedule: "45 4 * * *"
  image: python:3.14-slim
  # Long enough that a monthly payment and the importer's own re-fetch window both fall
  # inside it; short enough that an old, already-accepted oddity is not re-reported
  # every night forever.
  windowDays: 90
  # Payee accounts that are really your own accounts. Needed because an own account
  # with no IBAN in Firefly cannot be recognised from the payee name alone, which is
  # the case for every loan account.
  loanPayees: []
  # IBAN -> label for own accounts Firefly holds no IBAN for at all.
  extraOwnIbans: {}
  # Counterparties that legitimately exist as more than one payee account and would
  # otherwise be reported every night. Matched on the same normalised name as the scan.
  ignorePayees: []

# Splits each monthly mortgage lump into its Zins and Tilgung legs. Off by default:
# `loans` maps Firefly account ids, which are per-instance, so a wrong id would book
# one property's Tilgung against another property's debt.
loanSplit:
  enabled: false
  # After the 04:00 auto-import, before the 04:30 digest, so the digest reports on an
  # already-corrected ledger.
  schedule: "15 4 * * *"
  image: python:3.14-slim
  # One monthly cycle plus slack: the Bank D loan is debited at month end, the two
  # Bank C/Bank A ones at the start, so a 30-day window can straddle awkwardly.
  lookbackDays: 45
  dryRun: false
  # payee     - the self-payee expense account the bank's lump lands on
  # liability - the loan account the Tilgung belongs to
  # interest  - the expense account the Zins belongs to
  loans: []

# Carries a bank consent renewed in the web wizard into the configuration the nightly
# import reads, which is otherwise a manual copy of four fields and the one step of a
# re-authorisation that is easy to forget - leaving the import broken although the
# browser said it worked. Off by default: it needs the wizard's job directory persisted
# and mounted, which an instance only has once pvcMounts.import-jobs is given a host
# path.
syncConsent:
  enabled: false
  # Ahead of the 04:00 auto-import, so the first night after an SCA already uses the new
  # consent instead of wasting a run on the dead one.
  schedule: "50 3 * * *"
  image: python:3.14-slim
  dryRun: false

# Joins own-account transfers that both banks reported, which arrive as a withdrawal to
# a payee that is really your own account plus an unrelated deposit. Off by default
# because it deletes a transaction: it is only safe where payees genuinely carry the
# IBAN of the receiving account, which is what makes the pairing unambiguous.
linkTransfers:
  enabled: false
  # After the auto-import and the loan split, before the digest and the ledger check, so
  # neither of those reports what this job has just fixed.
  schedule: "25 4 * * *"
  image: python:3.14-slim
  # Matches the ledger check's window, so everything that check can report is also
  # within reach of this one.
  windowDays: 90
  dryRun: false

digest:
  enabled: false
  # 30 minutes after the auto-import, so it reports on that run.
  schedule: "30 4 * * *"
  image: python:3.14-slim
  # An account is flagged only when its silence exceeds BOTH this absolute floor
  # and the longest stretch that account has already been quiet in its own
  # history. A fixed day count cannot work: some accounts move daily, others a
  # few times a year.
  staleDays: 3
  # Ceiling for that per-account limit, so one long dormant stretch in an
  # account's past cannot excuse an unlimited silence in its present.
  staleMaxDays: 60
  # Slack on top of the record, because for a monthly account the record gap is
  # exactly one cycle: without it, rent arriving a couple of days late is enough
  # to raise an alarm that the next day's import answers by itself.
  staleMargin: 1.25
  # The newest auto-import pod must have started within this many hours, or the
  # digest reports that no import ran tonight. Must exceed the gap between the
  # auto-import schedule and the digest schedule, and stay below a day so that
  # yesterday's run cannot pass for tonight's.
  runMaxAgeHours: 12
  # A PSD2 consent lasts at most 90 days from the SCA, then the import stops with a
  # 401 and nothing warns beforehand. Reported this many days ahead so there is time
  # to re-authorise; 90 is the regulatory maximum, lower it if a bank grants less.
  consentDays: 90
  consentWarnDays: 7
  # Entry point quoted in the re-authorisation instructions that ride along with that
  # warning, so the mail can be acted on without looking the address up first. Left
  # empty the instructions still go out, just without a link.
  importerUrl: ""
  # Mail only when something needs attention. A daily "all fine" message is the
  # fastest way to train yourself to ignore the one that matters.
  alwaysSend: false
  # Accounts that are not nightly-imported and would otherwise be flagged forever
  # (manually refreshed depots, closed cards). Exact account names.
  ignoreStale: []
  # Dead man's switch for this job. Because a healthy night sends no mail at all,
  # a suspended CronJob, a crashed run and a dead mailbox are indistinguishable
  # from "nothing to report"; only a ping that stops arriving tells them apart.
  # A successful run pings the URL from /<akeyless path>/firefly/DIGEST_HEARTBEAT_URL.
  # Create that entry and the check itself BEFORE enabling this, otherwise the
  # ExternalSecret never syncs and the job cannot start. The check's period must
  # exceed the schedule above (daily), so period 1 day with a grace of a few hours.
  # doc/Alerting/watchdog-heartbeat.md walks through setting one up.
  heartbeat:
    enabled: false
