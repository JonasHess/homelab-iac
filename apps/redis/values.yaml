generic:
  deployment:
    # Full version, not "8": a floating tag runs whatever the node last pulled,
    # and Renovate can only propose updates for a pinned version.
    image: docker.io/library/redis:8.10.3
    ports:
    - containerPort: 6379
    pvcMounts:
      data:
        mountPath: /data
        hostPath: ~ # /mnt/somewhere/encrypted/apps/redis/data
    envFrom:
      configMapRef: redis-config
  service:
    ports:
    - name: redis
      port: 6379
