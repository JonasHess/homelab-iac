{{- $appName := required "appName must be set in values.yaml" .Values.appName }}

{{- if .Values.persistentVolumeClaims }}
  {{- $pvcMounts := (.Values.deployment | default dict).pvcMounts | default dict }}
  {{- range $pvcName, $pvcConfig := .Values.persistentVolumeClaims }}
  {{- /* Both paths name their PV, PVC and ResticBackup <app>-<key>; a shared key
         would emit two different objects under one name. */}}
  {{- if hasKey $pvcMounts $pvcName }}
    {{- fail (printf "persistentVolumeClaims.%s collides with deployment.pvcMounts.%s; use different keys" $pvcName $pvcName) }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ $appName }}-{{ $pvcName }}-pv"
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=true
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  # WARNING: THIS WILL DELETE THE PV AND ALL DATA INSIDE IT
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  hostPath:
    type: Directory
    path: {{ required (printf "hostPath for persistentVolumeClaims.%s must be specified" $pvcName) $pvcConfig.hostPath }}
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: "{{ $appName }}-{{ $pvcName }}-pvc"
    namespace: {{ $.Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ $appName }}-{{ $pvcName }}-pvc"
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=true
spec:
  storageClassName: ''
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  {{- end }}
{{- end }}