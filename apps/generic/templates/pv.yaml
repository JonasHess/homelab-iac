{{- $appName := required "appName must be set in values.yaml" .Values.appName }}

{{- if .Values.persistentVolume }}
  {{- range $pvName, $pvPath := .Values.persistentVolume }}
  {{- /* Capacity is a separate map rather than a field beside the path, because
         environments override persistentVolume with a bare path string; a map here
         would be replaced wholesale and the capacity would silently fall back to the
         default. For hostPath volumes capacity is nominal - nothing enforces it - but
         it must not understate reality, or a later move to an enforcing storage class
         provisions a volume far too small for the data already on disk. */}}
  {{- $capacity := dig $pvName "10Gi" ($.Values.persistentVolumeCapacity | default dict) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ $appName }}-{{ $pvName }}-pv"
  namespace: {{ $.Release.Namespace }}
  labels:
    app: "{{ $appName }}-{{ $pvName }}"
  annotations:
    argocd.argoproj.io/sync-options: Prune=true
spec:
  capacity:
    storage: {{ $capacity }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  # WARNING: THIS WILL DELETE THE PV AND ALL DATA INSIDE IT
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  hostPath:
    type: Directory
    path: {{ required (printf "path for persistentVolume.%s must be specified" $pvName) $pvPath }}
  {{- end }}
{{- end }}