generic:
  deployment:
    image: henrygd/beszel:0.20.0
    ports:
    - containerPort: 8090
    pvcMounts:
      data:
        mountPath: /beszel_data
        hostPath: ~ # /mnt/somewhere/unencrypted/apps/beszel/data
        backup:
          enabled: true
    # Hub admin user is auto-created from this Secret on first boot;
    # AUTO_LOGIN lets any OIDC-authenticated visitor enter without
    # seeing Beszel's password form. Rendered by hub-config-secret.yaml.
    envFrom:
      secretRef: beszel-hub-config
  service:
    ports:
    - name: http
      port: 8090
  ingress:
    https:
    - subdomain: beszel
      port: 8090
      oauth: true

# Hub admin credentials. The hub creates the user from these on first
# boot and the bootstrap Job authenticates as the same user. External
# access is OIDC-gated at the Envoy Gateway and AUTO_LOGIN bypasses
# Beszel's own form, so the password is never used outside the cluster.
auth:
  email: bootstrap@beszel.local
  password: beszel-internal-bootstrap-password-not-used-externally

# Bootstrap Job — runs once per sync. Auths via Beszel API, enables a
# permanent Universal Token, reads the hub's pubkey from the shared PV,
# and writes both into the agent's envFrom Secret. Idempotent.
bootstrap:
  enabled: true
  image: alpine:3.24

# Agent DaemonSet — off by default; opt in per environment.
agent:
  enabled: false
  # The -alpine variant is the only agent image carrying smartctl, which
  # is what produces the disk-health panel. The plain image is distroless
  # and silently reports no drives. Keep the version in sync with the hub.
  image: henrygd/beszel-agent:0.20.0-alpine
  listen: "45876"
  # Cluster-internal Service URL. Agents reach it via cluster DNS
  # (the DaemonSet sets dnsPolicy: ClusterFirstWithHostNet so cluster
  # DNS resolves alongside hostNetwork).
  hubUrl: http://beszel-service.argocd.svc.cluster.local:8090
  # Node-local directory holding the agent's fingerprint. It identifies the
  # agent to the hub for the lifetime of the registration, so it has to
  # survive pod replacement; a fresh one is rejected as a mismatch until
  # the stale fingerprint is dropped on the hub.
  dataHostPath: /var/lib/beszel-agent
  # Docker or Podman socket, optional. Host CPU/RAM/disk work without it.
  # A containerd socket does not work here: container metrics are read over
  # the Docker HTTP API and containerd only serves CRI over gRPC, so on a
  # containerd-only node (k3s, microk8s) there is nothing to point this at.
  containerSocket: ~
  smart:
    # Drives to expose for S.M.A.R.T., as base controllers (/dev/nvme0,
    # /dev/sda). A namespace or partition (/dev/nvme0n1, /dev/sda1) carries
    # no health data and yields an empty panel. Each entry is passed through
    # to the container and enables the raw-IO capabilities it needs.
    devices: []
