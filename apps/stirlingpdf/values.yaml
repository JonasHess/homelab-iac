generic:
  deployment:
    image: frooodle/s-pdf:3.2.2
    # Requests only, sized from measured usage, so this pod is among the last
    # to be evicted under memory pressure. No limit: it is Java, which sizes its heap from the memory limit.
    resources:
      requests:
        memory: "1536Mi"
        cpu: "50m"
    ports:
    - containerPort: 8080
    pvcMounts:
      config:
        mountPath: /configs
        hostPath:   # set per-environment, e.g. /mnt/tank1/encrypted/apps/stirlingpdf/config
        backup:
          enabled: true
  service:
    ports:
    - name: http
      port: 8080
  ingress:
    https:
    - subdomain: stirling-pdf
      port: 8080
      oauth: true
    - subdomain: pdf
      port: 8080
      oauth: true
