generic:
  deployment:
    image: lscr.io/linuxserver/readarr:develop-0.4.18.2805-ls157
    ports:
      - containerPort: 8787
    pvcMounts:
      config:
        mountPath: /config
        hostPath:   # /mnt/somewhere/unencrypted/apps/readarr/config
      media:
        mountPath: /mnt/media
        hostPath:   # /mnt/somewhere/encrypted/media
  service:
    ports:
      - name: http
        port: 8787
  ingress:
    https:
      - subdomain: readarr
        port: 8787
        oauth: true
      - subdomain: readarr
        pathPrefixes:
          - /api
        port: 8787
        oauth: false
