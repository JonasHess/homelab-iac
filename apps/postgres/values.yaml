generic:
  externalSecrets:
    postgres-secret:
      - POSTGRES_PASSWORD: "/postgres/POSTGRES_PASSWORD"
  deployment:
    # Full version, not "17": a floating tag runs whatever the node last pulled,
    # and Renovate can only propose updates for a pinned version.
    image: postgres:17.7
    # Requests only, sized from measured usage, so this pod is among the last
    # to be evicted under memory pressure. No limit: a too-tight one kills the app, and the node has ample headroom.
    resources:
      requests:
        memory: "256Mi"
        cpu: "50m"
    ports:
    - containerPort: 5432
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
      initialDelaySeconds: 30
      periodSeconds: 30
    pvcMounts:
      data:
        mountPath: /var/lib/postgresql/data
        hostPath: ~ # /mnt/somewhere/encrypted/apps/postgres/data
        backup:
          enabled: true
    envFrom:
      secretRef: postgres-secret
      configMapRef: postgres-config
    configMapMounts:
      postgresqlconf:
        mountPath: /etc/postgresql
        configMapName: postgres-config-file
  # Target of the nightly dump CronJob only; not mounted into the server, so adding
  # or moving it never restarts Postgres. The host directory must exist beforehand.
  persistentVolumeClaims:
    dumps:
      hostPath: ~ # /mnt/somewhere/encrypted/apps/postgres/dumps
      backup:
        enabled: true
  service:
    ports:
    - name: postgres
      port: 5432

dump:
  # Before restic-backup (02:00); both CronJobs use the cluster's time zone.
  schedule: "30 1 * * *"
  # Dumps kept on disk; restic keeps the older ones.
  keep: 3
