# See README.md for one-time setup instructions.

configMapName: "alexa-skill-config"
secretName: "alexa-deploy-credentials"

skillId: ~
lambdaArn: ~
lambdaRegion: ~
homeAssistantUrl: ~

files:
  skillJson: ~
  deDE: ~

# Installed by the deploy job before deploy.py runs.
# Keep the `name==version` form: Renovate's PyPI manager matches exactly that.
pythonPackages:
  - boto3==1.43.121

generic:
  externalSecrets:
    alexa-deploy-credentials:
      - LWA_CLIENT_ID: /alexa-custom-skill/LWA_CLIENT_ID
      - LWA_CLIENT_SECRET: /alexa-custom-skill/LWA_CLIENT_SECRET
      - LWA_REFRESH_TOKEN: /alexa-custom-skill/LWA_REFRESH_TOKEN
      - AWS_ACCESS_KEY_ID: /alexa-custom-skill/AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY: /alexa-custom-skill/AWS_SECRET_ACCESS_KEY
