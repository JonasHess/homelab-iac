apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: argocd-external-secret
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.global.externalSecrets.clusterSecretStoreRef.name }}

  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      metadata:
        annotations:
          X-Drone-Events: access-forbidden
          X-Drone-Repos: access-forbidden

  data:
    - secretKey: "oidc.auth0.clientSecret"
      remoteRef:
        key: "{{ .Values.global.akeyless.path }}{{ .Values.global.oidc.clientSecretAkeylessPath }}"

    - secretKey: "webhook.github.secret"
      remoteRef:
        key: "{{.Values.global.akeyless.path}}/argocd/webhook/github/secret"
