apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: {{ $.Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 90.1.1
    helm:
      # Values file as block file
      valuesObject:
        # Default values for kube-prometheus-stack.
        # This is a YAML-formatted file.
        # Declare variables to be passed into your templates.

        ## Provide a name in place of kube-prometheus-stack for `app:` labels
        ##
        nameOverride: ""

        prometheus:
          prometheusSpec:
            # Stamped onto every alert sent to Alertmanager (and onto federation and
            # remote-write), but NOT onto locally stored series, so dashboards and
            # recording rules are unaffected. Without it the route's group_by on
            # 'cluster' groups on a label that is always empty, a PagerDuty incident
            # cannot say which homelab it came from, and two clusters sharing one
            # PagerDuty service produce identical dedup keys - so one cluster's resolve
            # closes the other's incident.
            # dig, not dot notation: the key contains a hyphen, and global.cluster is
            # set per environment and absent from base-chart's defaults.
            externalLabels:
              cluster: {{ dig "cluster" "cluster-name" $.Values.global.domain $.Values.global | quote }}
            replicas: 1
            retention: 90d
            retentionSize: 50GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ""
                  accessModes: [ "ReadWriteOnce" ]
                  resources:
                    requests:
                      storage: 10Gi
                  selector:
                    matchLabels:
                      app: prometheus-prometheus
            additionalScrapeConfigsSecret:
              enabled: true
              name: prometheus-scrape-secret
              key: scrape-config.yaml

        grafana:
          defaultDashboardsTimezone: Europe/Berlin
          adminPassword: ""
          adminUser: admin
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            skipTlsVerify: true
            dashboards:
              enabled: true
              label: grafana_dashboard
          persistence:
            enabled: true
            existingClaim: prometheus-grafana-pvc
        alertmanager:
          alertmanagerSpec:
            logLevel: info
            secrets:
              - pagerduty-secret
              {{- if $.Values.watchdogHeartbeat.enabled }}
              - watchdog-heartbeat
              {{- end }}
            # Without this Alertmanager runs on an emptyDir: silences vanish on
            # restart, and so does the notification log, so every still-firing
            # alert is paged again after a restart. The selector binds to the
            # labelled PV that generic's persistentVolume.alertmanager creates.
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: ""
                  accessModes: [ "ReadWriteOnce" ]
                  resources:
                    requests:
                      storage: 10Gi
                  selector:
                    matchLabels:
                      app: prometheus-alertmanager
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['cluster', 'alertname']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: 'all-alerts'
              routes:
                - matchers:
                    - alertname = "Watchdog"
                  {{- if $.Values.watchdogHeartbeat.enabled }}
                  # Watchdog fires permanently by design, so forwarding it turns its
                  # ABSENCE into the signal: when Prometheus, Alertmanager or the node
                  # dies the pings stop and the external check notices.
                  # These two intervals set the ping rate; the rule's evaluation
                  # interval does not re-notify. Expect roughly DOUBLE this value in
                  # practice: Alertmanager only re-notifies on a group flush tick
                  # (group_interval) and only once repeat_interval has fully elapsed,
                  # so at the first tick it is a hair short and waits for the next one.
                  # Keep the resulting rate far below the far end's alert threshold, so
                  # that one dropped ping cannot raise a false alarm - a dead man's
                  # switch that cries wolf is worse than none, because it trains you to
                  # ignore it.
                  receiver: 'watchdog-heartbeat'
                  group_wait: 0s
                  group_interval: 1m
                  repeat_interval: 1m
                  {{- else }}
                  receiver: "null"
                  {{- end }}
                - matchers:
                    - alertname = "InfoInhibitor"
                  receiver: "null"
            receivers:
              - name: "null"
              {{- if $.Values.watchdogHeartbeat.enabled }}
              - name: 'watchdog-heartbeat'
                webhook_configs:
                  # send_resolved stays off: a resolved Watchdog is precisely the
                  # silence the far end is watching for. url_file keeps the ping URL
                  # out of Git - it is a capability URL, anyone holding it can keep
                  # the check green and mask a real outage.
                  - url_file: "/etc/alertmanager/secrets/watchdog-heartbeat/watchdog_heartbeat_url"
                    send_resolved: false
              {{- end }}
              - name: 'all-alerts'
                pagerduty_configs:
                  - send_resolved: true
                    service_key_file: "/etc/alertmanager/secrets/pagerduty-secret/pagerduty_service_key"
        defaultRules:
          create: true
          rules:
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false

  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ $.Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true