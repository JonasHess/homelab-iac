apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-evaluations
  namespace: {{ $.Release.Namespace }}
  labels:
    app: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  groups:
  - name: custom-evaluations
    interval: 1m
    rules:
    {{- if .Values.alerts.duplicati.enabled }}
    - alert: DuplicatiBackupNotSuccessful
      annotations:
        summary: "Duplicati backup failed"
        description: "The Duplicati backup has not been successful in the last 10 minutes."
      expr: |
        last_over_time(duplicati_ops_result[10m]) > 0
      for: 1m
      labels:
        severity: critical
    - alert: NoDuplicatiMetrics
      annotations:
        summary: "No Duplicati metrics found"
        description: "No Duplicati metrics have been found in the last 10 minutes."
      expr: |
        absent(duplicati_ops_result)
      for: 10m
      labels:
        severity: warning
    {{- end }}
    {{- if .Values.alerts.probes.enabled }}
    {{- /* The Prometheus Operator names a Probe's scrape job
           "probe/<namespace>/<probe-name>", not the bare probe name, so these
           matchers must be regexes. Matching the bare name selects no series at
           all, which makes the rule silently unfireable rather than noisy. */}}
    - alert: DomainProbeDown
      annotations:
        summary: "Blackbox probe for {{ `{{ $labels.instance }}` }} is failing"
        description: |
          {{ `{{ $labels.instance }}` }} has not answered the blackbox probe for
          over 2 minutes, so the site is unreachable from inside the cluster.
          Check, in this order: the Envoy Gateway pod and its listeners, the
          public DNS record for {{ .Values.global.domain }}, and whether the
          certificate that host serves is still valid.
      expr: |
        probe_success{job=~"probe/.*/domain-status-probe"} == 0
      for: 2m
      labels:
        severity: critical
    - alert: DomainProbeHighLatency
      annotations:
        summary: "Blackbox probe for {{ `{{ $labels.instance }}` }} took {{ `{{ $value | humanizeDuration }}` }}"
        description: |
          {{ `{{ $labels.instance }}` }} answered the blackbox probe, but took
          {{ `{{ $value | humanizeDuration }}` }} to do so (threshold 5s), sustained
          over 5 minutes. The site is up but slow for every user behind it.
      expr: |
        probe_duration_seconds{job=~"probe/.*/domain-status-probe"} > 5
      for: 5m
      labels:
        severity: warning
    - alert: GoogleProbeDown
      annotations:
        summary: "Internet connectivity probe to {{ `{{ $labels.instance }}` }} is failing"
        description: |
          The cluster could not reach {{ `{{ $labels.instance }}` }} for over
          2 minutes. This probes a third-party site precisely because it is not
          ours: failure points at the WAN link, the router, or upstream DNS
          rather than at anything running in the homelab.
      expr: |
        probe_success{job=~"probe/.*/google-status-probe"} == 0
      for: 2m
      labels:
        severity: warning
    - alert: GoogleProbeHighLatency
      annotations:
        summary: "Internet connectivity probe to {{ `{{ $labels.instance }}` }} took {{ `{{ $value | humanizeDuration }}` }}"
        description: |
          Reaching {{ `{{ $labels.instance }}` }} took
          {{ `{{ $value | humanizeDuration }}` }} (threshold 10s) for over 5 minutes.
          The WAN link is up but degraded.
      expr: |
        probe_duration_seconds{job=~"probe/.*/google-status-probe"} > 10
      for: 5m
      labels:
        severity: info
    {{- end }}
    - alert: ZFSPoolUnhealthy
      annotations:
        summary: "ZFS pool {{ `{{ $labels.pool }}` }} on {{ `{{ $labels.instance }}` }} is not ONLINE"
        description: |
          The exporter reports pool {{ `{{ $labels.pool }}` }} on
          {{ `{{ $labels.instance }}` }} in a non-ONLINE state (it reports 0 for
          ONLINE, non-zero for anything worse) averaged over 10 minutes, so this
          is a persistent state and not a scrape blip. Run "zpool status
          {{ `{{ $labels.pool }}` }}" on the host to see which device degraded.
      expr: |
        avg_over_time(zfs_pool_health[10m]) > 0
      for: 1m
      labels:
        severity: critical
    {{- with $.Values.global.lanDnsCheck }}
    - alert: LanInternalDnsBroken
      annotations:
        summary: "Internal DNS not returning the gateway IP for *.{{ $.Values.global.domain }}"
        description: |
          Internal DNS server {{ .dnsServer }} did not return {{ $.Values.global.gateway.loadBalancerIP }}
          for {{ .queryName }} for >5min. LAN clients are silently hairpinning
          through Cloudflare (slower, and LAN access dies if WAN/Cloudflare is
          down). Check the DNS server's reachability and the *.{{ $.Values.global.domain }}
          rewrite rule.
      expr: |
        probe_success{job=~"probe/.*/lan-dns-probe"} == 0
      for: 5m
      labels:
        severity: warning
    {{- end }}
    - alert: EnvoyRouteHigh5xxRate
      annotations:
        summary: "{{ `{{ $labels.envoy_cluster_name }}` }} is answering {{ `{{ $value | humanizePercentage }}` }} 5xx"
        description: |
          The backend behind {{ `{{ $labels.envoy_cluster_name }}` }} answered 5xx
          for {{ `{{ $value | humanizePercentage }}` }} of its requests over the last
          5 minutes. Envoy names the backend after the Gateway API object that
          routed the traffic, as httproute/<namespace>/<route-name>/rule/<index>,
          so that string identifies the HTTPRoute to inspect and the namespace
          its backing Service lives in.
          Likely causes: the backing Service has no ready endpoints, the route
          targets the wrong port, or the application itself is erroring.
      expr: |
        (
          sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m]))
          /
          sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx[5m]))
        ) > 0.05
        and
        sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx[5m])) > 0.05
      for: 5m
      labels:
        severity: warning
    - alert: EnvoyHigh5xxRate
      annotations:
        summary: "Envoy listener {{ `{{ $labels.envoy_http_conn_manager_prefix }}` }} is serving {{ `{{ $value | humanizePercentage }}` }} 5xx"
        description: |
          Listener {{ `{{ $labels.envoy_http_conn_manager_prefix }}` }} returned 5xx
          for {{ `{{ $value | humanizePercentage }}` }} of the responses it sent to
          clients over the last 5 minutes.
          This counts what clients received, so unlike EnvoyRouteHigh5xxRate it
          also catches the 5xx Envoy generates without ever reaching a backend:
          no healthy upstream, no matching route, or a failing OIDC filter. If
          EnvoyRouteHigh5xxRate is silent while this fires, the fault is in the
          gateway or its configuration rather than in an application.
          The listener name encodes the entry point: https-10443 is the LAN
          listener, https-4443 the Cloudflare mTLS one, http-10080 the redirect.
      expr: |
        (
          sum by (envoy_http_conn_manager_prefix) (rate(envoy_http_downstream_rq_xx{envoy_response_code_class="5", envoy_http_conn_manager_prefix=~"https?-.*"}[5m]))
          /
          sum by (envoy_http_conn_manager_prefix) (rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~"https?-.*"}[5m]))
        ) > 0.05
        and
        sum by (envoy_http_conn_manager_prefix) (rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~"https?-.*"}[5m])) > 0.05
      for: 5m
      labels:
        severity: warning
    - alert: EnvoyProxyScrapeDown
      annotations:
        summary: "Envoy proxy Prometheus scrape is down"
        description: |
          No Envoy proxy target is being scraped successfully (job matching
          .*envoy-proxy.*). Either the proxy pod is unreachable, the metrics
          endpoint is not exposed (Telemetry config), or the PodMonitor is
          broken. While this fires, every other Envoy alert here is blind and
          will stay silent no matter how badly ingress is failing.
      expr: |
        absent(up{job=~".*envoy-proxy.*"} == 1)
      for: 5m
      labels:
        severity: warning
    - alert: CertificateExpiringSoon
      annotations:
        summary: "{{ `{{ $labels.name }}` }} expires in {{ `{{ $value | humanizeDuration }}` }}"
        description: |
          The certificate {{ `{{ $labels.name }}` }} in namespace
          {{ `{{ $labels.namespace }}` }} expires in
          {{ `{{ $value | humanizeDuration }}` }}. cert-manager renews at two thirds of a
          certificate's lifetime, so reaching 14 days means renewal has already failed at
          least once - check the Certificate's status conditions and the DNS-01 solver.
          Without this the first symptom is DomainProbeDown, which only fires once the
          certificate has expired and visitors are already being turned away.
      expr: |
        certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
      for: 1h
      labels:
        severity: warning
    - alert: CertificateNotReady
      annotations:
        summary: "Certificate {{ `{{ $labels.name }}` }} is not ready"
        description: |
          cert-manager has reported {{ `{{ $labels.name }}` }} in namespace
          {{ `{{ $labels.namespace }}` }} as not ready for over an hour. Every route that
          serves this certificate will fail TLS once the current one expires.
      expr: |
        certmanager_certificate_ready_status{condition="False"} == 1
      for: 1h
      labels:
        severity: warning
    - alert: BackupTooOld
      annotations:
        summary: "{{ `{{ $labels.cronjob }}` }} last succeeded {{ `{{ $value | humanizeDuration }}` }} ago"
        description: |
          The CronJob {{ `{{ $labels.cronjob }}` }} in namespace
          {{ `{{ $labels.namespace }}` }} has not completed successfully for over 36
          hours, against a daily schedule.
          A CronJob that stops being scheduled produces no failing Job at all, so
          KubeJobFailed stays silent: this is the only signal that backups have stopped.
          Scoped to restic-backup by name rather than a prefix, because restic-restore
          runs yearly and would breach any freshness threshold permanently.
      expr: |
        time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob="restic-backup"}) > 36 * 3600
      for: 10m
      labels:
        severity: critical
    - alert: NoZFSMetrics
      annotations:
        summary: "No ZFS metrics found"
        description: |
          The zfs_pool_health metric has been absent for 10 minutes. It is
          scraped from the zfs_exporter on {{ .Values.global.cluster.serverip }}:9134
          (scrape job zfs_status), so check that the exporter is running on the
          host and reachable from the cluster. While this fires, ZFSPoolUnhealthy
          cannot fire: pool degradation would go unnoticed.
      expr: |
        absent(zfs_pool_health)
      for: 10m
      labels:
        severity: warning
