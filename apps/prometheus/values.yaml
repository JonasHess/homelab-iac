# Dead man's switch. Off by default because it needs a per-cluster ping URL at
# <global.akeyless.path>/o11y/alertmanager/watchdog_heartbeat_url; without that
# secret the ExternalSecret never syncs and Alertmanager cannot mount it, so the
# whole pod fails. Two clusters must never share one URL - either one alone would
# keep the check green. See doc/Alerting/watchdog-heartbeat.md.
watchdogHeartbeat:
  enabled: false

# Feature flags for optional alerts
alerts:
  duplicati:
    enabled: false
  probes:
    enabled: true  # Set to false to disable probe/blackbox alerts

generic:
  externalSecrets:
    grafana-admin-credentials:
      - admin-user: "/o11y/grafana/admin-user"
      - admin-password: "/o11y/grafana/admin-password"
    pagerduty-secret:
      - pagerduty_service_key: "/o11y/alertmanager/pagerduty_service_key"
  ingress:
    https:
    - subdomain: prometheus
      port: 9090
      service: kube-prometheus-stack-prometheus
      oauth: true
    - subdomain: grafana
      port: 80
      service: kube-prometheus-stack-grafana
      oauth: true
    - subdomain: alertmanager
      port: 9093
      service: kube-prometheus-stack-alertmanager
      oauth: true
  # Declared capacity, not a limit: the TSDB held 40.8 GiB at 90d retention when this
  # was set, against a retentionSize cap of 50GB. 60Gi leaves the declaration above
  # both. Kept out of persistentVolume so an environment overriding the path does not
  # drop it.
  persistentVolumeCapacity:
    prometheus: 60Gi
  persistentVolume:
    prometheus: /mnt/somewhere/unencrypted/apps/prometheus/data
    # Alertmanager's StatefulSet creates its own claim, which can only bind to a
    # PV that is labelled and unclaimed. persistentVolumeClaims would instead pin
    # the PV with a claimRef to a fixed claim name the StatefulSet never uses.
    alertmanager: /mnt/somewhere/unencrypted/apps/prometheus/alertmanager/data
  persistentVolumeClaims:
    grafana:
      hostPath: ~ # /mnt/somewhere/unencrypted/apps/prometheus/grafana/data
