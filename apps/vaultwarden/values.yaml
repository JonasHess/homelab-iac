generic:
  externalSecrets:
    vaultwarden-secret:
      - ADMIN_TOKEN: "/vaultwarden/ADMIN_TOKEN"
    vaultwarden-smtp-secret:
      - SMTP_USERNAME: "/vaultwarden/SMTP_USERNAME"
      - SMTP_PASSWORD: "/vaultwarden/SMTP_PASSWORD"
  persistentVolumeClaims:
    data:
      hostPath:   # /mnt/somewhere/encrypted/apps/vaultwarden/data
      backup:
        enabled: true
  ingress:
    https:
      - subdomain: vaultwarden
        port: 80
        service: vaultwarden
        oauth: false
      # The admin panel only needs a browser, so it can sit behind OIDC; the
      # longer prefix outranks the route above. The Bitwarden clients never call
      # /admin, so they keep using the OIDC-free route.
      - subdomain: vaultwarden
        port: 80
        service: vaultwarden
        pathPrefixes:
          - /admin
        oauth: true
smtp:
  host: smtp.example.com
  from: vaultwarden@example.com
  fromName: Vaultwarden

# Shared by the server (templates/vaultwarden-application.yaml) and the database
# backup CronJob, so the backup always runs the server's own version.
image:
  # renovate: depName=vaultwarden/server
  tag: "1.37.4-alpine"

dbBackup:
  # Before restic-backup (02:00); both CronJobs use the cluster's time zone.
  schedule: "45 1 * * *"
  # Backups kept in the data folder; restic keeps the older ones.
  keep: 3
