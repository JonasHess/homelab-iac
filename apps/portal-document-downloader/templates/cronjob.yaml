{{- $appName := required "appName must be set in values.yaml" .Values.appName }}
{{- if .Values.portalDocumentDownloader }}
{{- if .Values.portalDocumentDownloader.portals }}
{{- range $portalName, $portalConfig := .Values.portalDocumentDownloader.portals }}
{{- if  $portalConfig.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $portalName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $appName }}
    component: document-downloader
    portal: {{ $portalName }}
spec:
  schedule: {{ required (printf "schedule must be specified for portal %s" $portalName) $portalConfig.schedule | quote }}
  suspend: {{ if hasKey $portalConfig "suspend" }}{{ $portalConfig.suspend }}{{ else }}true{{ end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: {{ $appName }}
            component: document-downloader
            portal: {{ $portalName }}
        spec:
          # Never, not OnFailure: on OnFailure the job controller deletes the
          # pod once the backoff limit is hit, taking the only record of why a
          # portal login failed with it. With Never each attempt gets its own
          # pod and those pods are kept, so the logs outlive the failure.
          restartPolicy: Never
          {{- if $.Values.portalDocumentDownloader.imagePullSecrets }}
          imagePullSecrets:
          {{- range $.Values.portalDocumentDownloader.imagePullSecrets }}
          - name: {{ .name }}
          {{- end }}
          {{- end }}
          containers:
          - name: downloader
            image: {{ required "image must be specified" $.Values.portalDocumentDownloader.image }}:{{ $.Values.portalDocumentDownloader.imageTag | default "latest" }}
            imagePullPolicy: IfNotPresent
            {{- if $portalConfig.flat }}
            args:
            - "--flat"
            {{- end }}
            env:
            {{- range $key, $value := $portalConfig.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $.Values.portalDocumentDownloader.externalSecret.enabled }}
            envFrom:
            - secretRef:
                name: {{ $portalName }}-credentials
            {{- end }}
            {{- if $portalConfig.bluetooth }}
            # Bluetooth is how a phone proves it is next to the machine showing
            # a passkey QR code. The browser reaches the host's adapter through
            # BlueZ on the host's system D-Bus, and the bus refuses messages
            # from a container under the runtime's default AppArmor profile -
            # the browser then sees no adapter and offers no QR code at all.
            securityContext:
              appArmorProfile:
                type: Unconfined
            {{- end }}
            volumeMounts:
            - name: downloads
              mountPath: /app/downloads
            {{- if $portalConfig.bluetooth }}
            - name: host-dbus
              mountPath: /run/dbus/system_bus_socket
            {{- end }}
          volumes:
          - name: downloads
            persistentVolumeClaim:
              claimName: {{ $appName }}-downloads-{{ $portalName }}-pvc
          {{- if $portalConfig.bluetooth }}
          - name: host-dbus
            hostPath:
              path: /run/dbus/system_bus_socket
              type: Socket
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
