appName: portal-document-downloader

generic:
  persistentVolumeClaims: {}

portalDocumentDownloader:
  image: "339712710461.dkr.ecr.eu-central-1.amazonaws.com/portal-document-downloader"
  imageTag: "v14.0.0"
  imagePullSecrets:
    - name: regcred-secondary

  externalSecret:
    enabled: true
    secretStoreName: akeyless-secret-store

  # Example portal configuration:
  #   treubau:
  #     enabled: true
  #     schedule: "0 2 1 * *"
  #     suspend: false
  #     flat: true
  #     env:
  #       PORTAL: "treubau"
  #     secrets:
  #       TREUBAU_KURZNAME: /portal-document-downloader/TREUBAU_KURZNAME
  #       TREUBAU_PASSWORT: /portal-document-downloader/TREUBAU_PASSWORT
  #
  # A portal whose login needs a passkey from a phone can set
  #   bluetooth: true
  # to give it the host's Bluetooth: the host's D-Bus socket is mounted and the
  # container runs without an AppArmor profile, which loosens its isolation -
  # so only portals that need it should set it.
  #
  # By default a portal writes into the volume `downloads-<portal>`. Portals can share
  # one volume instead and each write into a subfolder named by a key of its secret:
  #   volume: downloads-shared
  #   subdirFrom: TREUBAU_SUBDIR      # secret key holding the folder name
  portals: {}
