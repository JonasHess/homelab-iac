generic:
  configMaps:
    venice-autobook-config:
      # rules.yaml, tokens.json and autobook.db all live on the mounted PVC.
      VB_CONFIG_DIR: "/data"
      VB_DATA_DIR: "/data"
  externalSecrets:
    venice-autobook-secret:
      - VB_USERNAME: "/venice-autobook/VB_USERNAME"
      - VB_PASSWORD: "/venice-autobook/VB_PASSWORD"
      - NTFY_URL: "/venice-autobook/NTFY_URL"
      - SMTP_PASSWORD: "/venice-autobook/SMTP_PASSWORD"
  deployment:
    image: 339712710461.dkr.ecr.eu-central-1.amazonaws.com/venice-autobook:v0.3.5
    imagePullSecrets:
      - regcred-secondary
    ports:
      - containerPort: 8080
    pvcMounts:
      data:
        mountPath: /data
        hostPath: ~
        backup:
          enabled: true
    envFrom:
      configMapRef: venice-autobook-config
      secretRef: venice-autobook-secret
  # Consistent nightly copy (autobook.db.backup) for restic at 02:00.
  # runAsUser must own the data folder (the image runs as 10001).
  sqliteBackup:
    schedule: "50 1 * * *"
    image: python:3.15-slim
    runAsUser: 10001
    databases:
      - pvc: data
        file: autobook.db

  service:
    ports:
      - name: http
        port: 8080
  ingress:
    https:
      - subdomain: venice-autobook
        port: 8080
        oauth: true
