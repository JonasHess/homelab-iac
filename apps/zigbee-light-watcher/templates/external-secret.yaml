{{- /*
  MQTT login for the broker. The account is the one smarthome4 and smarthome4-ui
  use; the watcher only reads, so it needs no account of its own until the broker
  gets per-user ACLs.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.appName }}-mqtt
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.global.externalSecrets.clusterSecretStoreRef.name }}
  target:
    name: {{ .Values.appName }}-mqtt
    creationPolicy: Owner
  data:
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: "{{ .Values.global.akeyless.path }}{{ .Values.mqtt.usernamePath }}"
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: "{{ .Values.global.akeyless.path }}{{ .Values.mqtt.passwordPath }}"
