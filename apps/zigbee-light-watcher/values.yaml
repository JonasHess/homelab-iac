image: python:3.15.2-slim
# Installed by the init container at pod start; the script needs nothing else.
# Keep the `name==version` form: Renovate's PyPI manager matches exactly that.
pythonPackages:
  - paho-mqtt==2.2.0
  - prometheus-client==0.26.0

mqtt:
  # The broker lives in the argocd namespace; this app does not.
  host: mosquitto-service.argocd.svc.cluster.local
  port: 1883
  # Akeyless paths (below global.akeyless.path) of the broker login.
  usernamePath: /smarthome4/MQTT_BROKER_USERNAME
  passwordPath: /smarthome4/MQTT_BROKER_PASSWORD
z2mBaseTopic: zigbee2mqtt

# Every light is read once per interval, spread evenly across it.
pollIntervalSeconds: 60
# Lights matching this regex are not polled (e.g. lamps usually switched off at the plug).
excludeRegex: ""
metricsPort: 9105
# Seconds a lone ghost light (ON although commanded OFF, while the rest of its group is
# OFF) may stay on before the watcher switches it off; empty = never. The watcher also
# waits until it re-read the group siblings. Above pollIntervalSeconds the light itself is
# re-read once more first, so a single misread switches nothing.
autoOffSeconds: ""

alerts:
  # A light that is ON although it was last commanded OFF, for this long.
  ghostLightFor: 1m
