{{- if .Values.pytr.csvVersions.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-csv-version-script
  namespace: {{ .Release.Namespace }}
data:
  merge_csv_versions.py: |
    #!/usr/bin/env python3
    """
    Folds a freshly imported account_transactions.csv into the existing versioned
    document in Paperless instead of leaving a second top-level entry behind.

    pytr writes a cumulative export on every run: same filename, different bytes.
    Paperless deduplicates on checksum, so each run adds another document that fully
    contains the previous one. Merging them as versions keeps one list entry whose
    current version is the newest export, with the older ones still reachable.

    Started right after a download, it waits up to CSV_WAIT_MINUTES for Paperless to
    finish consuming the export that download produced: the download and then
    Paperless's queue, one document every few seconds, can take well over an hour when
    many documents are new. It waits for the consume task, not for a new document,
    because an export without new bookings is byte-identical to the last one and
    Paperless rejects it as a duplicate - which means there is simply nothing to merge.

    Exit codes: 0 on success and when there is nothing to merge, 1 on any API error,
    when Paperless rejects the export for another reason, or when no export arrives
    within the wait.

    Env: PAPERLESS_URL, PAPERLESS_API_TOKEN, ROOT_DOCUMENT_ID, CSV_FILENAME,
         CSV_WAIT_MINUTES (0 = look once)
    """
    import datetime
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    BASE = os.environ["PAPERLESS_URL"].rstrip("/")
    TOKEN = os.environ["PAPERLESS_API_TOKEN"]
    ROOT_ID = int(os.environ["ROOT_DOCUMENT_ID"])
    FILENAME = os.environ.get("CSV_FILENAME", "account_transactions.csv")
    WAIT_MINUTES = int(os.environ.get("CSV_WAIT_MINUTES", "0"))
    POLL_SECONDS = 120


    def api(path, payload=None):
        url = f"{BASE}{path}"
        data = json.dumps(payload).encode() if payload is not None else None
        req = urllib.request.Request(url, data=data, method="POST" if data else "GET")
        req.add_header("Authorization", f"Token {TOKEN}")
        req.add_header("Accept", "application/json")
        if data:
            req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=120) as resp:
                return json.loads(resp.read() or b"{}")
        except urllib.error.HTTPError as exc:
            body = exc.read().decode(errors="replace")[:500]
            print(f"ERROR {exc.code} on {path}: {body}", flush=True)
            raise


    def first_transaction(content):
        """The first data row, i.e. the oldest booking, or None if there is none.

        Every export starts at the account's first booking, so this row is identical
        across all exports of one account and differs between accounts. That makes it
        the fingerprint that says whether a new export continues this chain, without
        the job having to be told anything about the account or its holder.
        """
        rows = [line.strip() for line in (content or "").splitlines() if line.strip()]
        return rows[1] if len(rows) > 1 else None


    def exports_to_merge():
        """(added, id) of every unmerged export of this account, or None when the root
        document cannot be trusted to merge into."""
        # The document list endpoint only ever returns top-level documents, so versions
        # that were merged in on an earlier run cannot show up here again.
        query = urllib.parse.urlencode(
            {"original_filename__iexact": FILENAME, "page_size": 100},
        )
        candidates = api(f"/api/documents/?{query}").get("results", [])

        if not any(doc["id"] == ROOT_ID for doc in candidates):
            print(
                f"Document {ROOT_ID} is not a top-level document named {FILENAME}. "
                f"Refusing to merge into it.",
                flush=True,
            )
            return None

        fingerprint = first_transaction(api(f"/api/documents/{ROOT_ID}/").get("content"))
        if fingerprint is None:
            print(f"Document {ROOT_ID} has no transaction rows to compare against.")
            return None

        # Several accounts export under this one filename, so a candidate is only ours
        # when it starts at the same booking. Skipping on anything else is the safe
        # direction: a skipped export can be merged by hand, a wrongly merged one mixes
        # two accounts into one history.
        to_merge = []
        for doc in candidates:
            if doc["id"] == ROOT_ID:
                continue
            detail = api(f"/api/documents/{doc['id']}/")
            if first_transaction(detail.get("content")) != fingerprint:
                print(
                    f"Skipping document {doc['id']}: it starts at a different booking, "
                    f"so it belongs to another account.",
                    flush=True,
                )
                continue
            to_merge.append((detail.get("added") or "", doc["id"]))
        return to_merge


    def consume_task_since(started):
        """The newest finished Paperless consume task for FILENAME created after
        `started`, or None. Another account exporting under the same name can finish
        first; its export is then skipped below and this one waits for the next run."""
        # The file name filter of /api/tasks/ is not honoured by every Paperless version,
        # so the name is checked here; the task type filter is.
        tasks = api("/api/tasks/?task_type=consume_file")
        tasks = tasks if isinstance(tasks, list) else tasks.get("results", [])
        done = [t for t in tasks
                if (t.get("input_data") or {}).get("filename") == FILENAME
                and t.get("date_created")
                and datetime.datetime.fromisoformat(t["date_created"]) >= started
                and t.get("status", "").lower() in ("success", "failure")]
        return max(done, key=lambda t: t["date_created"]) if done else None


    def main():
        failed = False
        if WAIT_MINUTES > 0:
            started = datetime.datetime.now(datetime.timezone.utc)
            deadline = time.time() + WAIT_MINUTES * 60
            task = consume_task_since(started)
            while task is None and time.time() < deadline:
                print(f"Waiting for Paperless to consume the new {FILENAME}...", flush=True)
                time.sleep(POLL_SECONDS)
                task = consume_task_since(started)
            if task is None:
                print(f"No {FILENAME} was consumed within {WAIT_MINUTES} minutes.", flush=True)
                failed = True
            elif task["status"].lower() == "failure":
                duplicate = (task.get("result_data") or {}).get("duplicate_of")
                if duplicate:
                    print(f"The export is unchanged (duplicate of document {duplicate}).",
                          flush=True)
                else:
                    print(f"Paperless rejected the export: {task.get('result')}", flush=True)
                    failed = True

        to_merge = exports_to_merge()
        if to_merge is None:
            return 1
        if not to_merge:
            print(f"Nothing to merge into document {ROOT_ID}.", flush=True)
            return 1 if failed else 0

        # Oldest first: every merged document gets the next version_index, and the highest
        # index counts as the current version. Feeding them in reverse would make an
        # outdated export the one that Paperless shows and indexes.
        to_merge.sort()
        ids = [doc_id for _, doc_id in to_merge]

        print(f"Merging {ids} as versions of document {ROOT_ID}.", flush=True)
        api(
            "/api/documents/merge_as_versions/",
            {"documents": [ROOT_ID, *ids], "root_document_id": ROOT_ID},
        )
        print("Merge accepted.", flush=True)
        return 1 if failed else 0


    if __name__ == "__main__":
        try:
            sys.exit(main())
        except urllib.error.URLError as exc:
            print(f"ERROR talking to {BASE}: {exc}", flush=True)
            sys.exit(1)
{{- end }}
