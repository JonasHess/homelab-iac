apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-download
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.appName }}
    component: download
spec:
  schedule: {{ .Values.pytr.download.schedule | quote }}
  suspend: {{ .Values.pytr.download.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: {{ .Values.appName }}
            component: download
        spec:
          restartPolicy: OnFailure
          containers:
          - name: download
            image: {{ .Values.pytr.image }}
            command: ["sh", "-c"]
            envFrom:
            - secretRef:
                name: {{ .Values.appName }}-credentials
            args:
              - |
                export HOME=/home/pytr && \
                mkdir -p /home/pytr/.pytr && \
                printf '%s\n%s\n' "$PHONE_NUMBER" "$PIN" > /tmp/credentials && \
                ln -sf /tmp/credentials /home/pytr/.pytr/credentials && \
                # The [playwright] extra is required: pytr fetches the AWS WAF token that
                # app.traderepublic.com demands by driving a headless Chromium, and the
                # playwright Python package ships only in that extra. The base image
                # provides the browser binaries and system libraries, not the package.
                pip install --quiet 'pytr[playwright]=={{ .Values.pytr.pytrVersion }}' && \
                # pytr skips a document only when its target file is already on disk; it keeps
                # no download ledger (0.4.10 removed the one 0.4.9 had). Downloading straight
                # into the Paperless consume directory therefore refetches the whole history on
                # every run, because Paperless deletes each file it ingests. /archive is the
                # durable copy that makes the skip work, and only files this run created are
                # handed to Paperless.
                # The output directory is POSITIONAL. Writing "-path /x" parses as "-p ath",
                # i.e. --pin, and silently logs in with the PIN "ath".
                { [ -f /archive/.synced ] && seeded=1 || seeded=0 ; } && \
                pytr dl_docs /archive ; \
                rc=$? ; \
                # First run only: /archive starts empty, so everything looks new. Paperless
                # already holds these documents, so stamp .synced and copy nothing rather than
                # pushing ~500 files through the consumer to be rejected one by one.
                if [ "$seeded" = 1 ]; then ( cd /archive && find . -name '*.pdf' -newer .synced -exec cp --parents -t /downloads {} + ) ; fi ; \
                # Unconditional: the CSV is rewritten every run, is not a *.pdf, and the
                # csv-versions job needs it to reach Paperless to fold it into its document.
                cp -f /archive/account_transactions.csv /downloads/ 2>/dev/null ; \
                touch /archive/.synced ; \
                rm -f /home/pytr/.pytr/credentials ; \
                chown -R 1000:1000 /archive /downloads ; \
                chmod -R u+rwX /archive /downloads ; \
                exit $rc
            volumeMounts:
            - name: pytr-session
              mountPath: /home/pytr/.pytr
            - name: pytr-archive
              mountPath: /archive
            - name: pytr-downloads
              mountPath: /downloads
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: pytr-session
            persistentVolumeClaim:
              claimName: {{ .Values.appName }}-credentials-pvc
          - name: pytr-archive
            persistentVolumeClaim:
              claimName: {{ .Values.appName }}-archive-pvc
          - name: pytr-downloads
            persistentVolumeClaim:
              claimName: {{ .Values.appName }}-downloads-pvc
          - name: tmp
            emptyDir:
              medium: Memory
