LLM_PROVIDER: openai
LLM_MODEL: gpt-4o
LOG_LEVEL: INFO
AWS_OCR_BUCKET_NAME: paperless-ocr
PROMPT_TITLE_EXPLANATION: ''
PROMPT_DOCUMENT_TYPE_EXPLANATION: ''
PROMPT_CORRESPONDENT_EXPLANATION: ''
PROMPT_POSTAMBLE: ''
generic:
  externalSecrets:
    paperlessgpt-secret:
      - PAPERLESS_API_TOKEN: "/paperlessgpt/PAPERLESS_API_TOKEN"
      - OPENAI_API_KEY: "/paperlessgpt/OPENAI_API_KEY"
      - ANTHROPIC_API_KEY: "/paperlessgpt/ANTHROPIC_API_KEY"
      - AWS_ACCESS_KEY_ID: "/paperlessgpt/AWS_ACCESS_KEY_ID"
      - AWS_SECRET_ACCESS_KEY: "/paperlessgpt/AWS_SECRET_ACCESS_KEY"
      - PROMPT_PREAMBLE: "/paperlessgpt/PROMPT_PREAMBLE"
      - CORRESPONDENT_BLACK_LIST: "/paperlessgpt/CORRESPONDENT_BLACK_LIST"
      - PROMPT_TAGS_EXPLANATION: "/paperlessgpt/PROMPT_TAGS_EXPLANATION"
  deployment:
    image: jonashess/paperless-gpt:v1.4.6
    pvcMounts:
      prompts:
        mountPath: /app/prompts
        hostPath: ~ # /mnt/somewhere/encrypted/apps/paperless-gpt/prompts
        backup:
          enabled: true
    configMapMounts:
      prompt:
        mountPath: /app/config/prompts
        configMapName: paperlessgpt-prompt
    envFrom:
      secretRef: paperlessgpt-secret
      configMapRef: paperlessgpt-config
# Weekly mail listing what paperless-gpt filed questionably in the last days. Off by
# default; an environment enables it and sets the SMTP account. The Akeyless entry at
# smtp.passwordPath must exist before enabling, otherwise the ExternalSecret cannot sync.
qualityReport:
  enabled: false
  # Monday morning, covering the past week.
  schedule: "0 7 * * 1"
  image: python:3.15-slim
  days: 7
  # Mail only when something needs a look; true also mails quiet weeks.
  alwaysSend: false
  # Dead man's switch: every completed run pings this URL, so a job that stops running
  # is noticed although quiet weeks send no mail. Enable only after the Akeyless entry
  # at urlPath exists.
  heartbeat:
    enabled: false
    urlPath: /paperlessgpt/REPORT_HEARTBEAT_URL
  # A document still carrying the paperless-gpt tag after this long has failed.
  queueMaxAgeHours: 1
  publicUrl: ""
  # Theme tags a document is expected to carry at least one of.
  themeTags:
    - Arbeit & Beruf
    - Reisen & Urlaube
    - Ausweise & Dokumente
    - Bank & Finanzen
    - Bildung & Qualifikationen
    - Fahrzeug & Transport
    - Familie & Partnerschaft
    - Gesundheit & Krankenkasse
    - Rechnungen & Belege
    - Rechtliches & Anwaltliches
    - Freizeit & Persönliches
    - Steuern & Finanzamt
    - Versicherung & Vorsorge
    - Verträge & Abonnements
    - Wohnung & Immobilien
  smtp:
    host: ""
    port: 587
    encryption: tls
    username: ""
    from: ""
    fromName: Paperless Qualitätsreport
    destination: ""
    passwordPath: /paperlessgpt/MAIL_PASSWORD
