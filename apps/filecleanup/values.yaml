appName: filecleanup

generic:
  persistentVolumeClaims: {}
#    sabnzbd-download:
#      hostPath: /data/volumes/sabnzbd-downloads
  externalSecrets:
    filecleanup-sabnzbd-api:
      - SABNZBD_API_KEY: /apps/filecleanup/sabnzbd/api-key
    filecleanup-radarr-api:
      - RADARR_API_KEY: /apps/filecleanup/radarr/api-key

filecleanup:
  dryRun: true  # Global dry-run toggle for testing
  cleanupJobs: {}
#    sabnzbd-download:  # Must match a key in generic.persistentVolumeClaims
#      retentionDays: 7
#      cleanupEmptyDirs: true
#      schedule: "0 2 * * *"  # 2 AM daily

  sabnzbdApiCleanup:
    enabled: true
    reportOnly: true
    schedule: "*/30 * * * *"
    minimumAgeHours: 48
    maximumCandidatesPerRun: 100
    sabnzbdUrl: http://sabnzbd-service.argocd.svc.cluster.local:8080
    radarrUrl: http://radarr-service.argocd.svc.cluster.local:7878
    downloadsPvc: filecleanup-sabnzbd-download-pvc
    image: python:3.12.11-alpine3.22
