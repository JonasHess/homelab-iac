{{- $config := .Values.filecleanup.sabnzbdApiCleanup }}
{{- if $config.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-sabnzbd-api-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.appName }}
    component: sabnzbd-api-cleanup
data:
  sabnzbd_api_cleanup.py: |
{{ .Files.Get "scripts/sabnzbd_api_cleanup.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-sabnzbd-api-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.appName }}
    component: sabnzbd-api-cleanup
spec:
  schedule: {{ $config.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: {{ .Values.appName }}
            component: sabnzbd-api-cleanup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: audit
              image: {{ $config.image | quote }}
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /opt/filecleanup/sabnzbd_api_cleanup.py
              env:
                - name: SABNZBD_URL
                  value: {{ $config.sabnzbdUrl | quote }}
                - name: RADARR_URL
                  value: {{ $config.radarrUrl | quote }}
                - name: SONARR_URL
                  value: {{ $config.sonarrUrl | quote }}
                - name: DOWNLOAD_ROOT
                  value: /mnt/downloads
                - name: MINIMUM_AGE_HOURS
                  value: {{ $config.minimumAgeHours | quote }}
                - name: MAXIMUM_CANDIDATES_PER_RUN
                  value: {{ $config.maximumCandidatesPerRun | quote }}
                - name: MAXIMUM_DELETIONS_PER_RUN
                  value: {{ $config.maximumDeletionsPerRun | quote }}
                - name: REPORT_ONLY
                  value: {{ $config.reportOnly | quote }}
                - name: SABNZBD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: filecleanup-sabnzbd-api
                      key: SABNZBD_API_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: filecleanup-radarr-api
                      key: RADARR_API_KEY
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: filecleanup-sonarr-api
                      key: SONARR_API_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /opt/filecleanup
                  readOnly: true
                - name: downloads
                  mountPath: /mnt/downloads
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: {{ .Values.appName }}-sabnzbd-api-cleanup
                defaultMode: 0444
            - name: downloads
              persistentVolumeClaim:
                claimName: {{ $config.downloadsPvc }}
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
{{- end }}
