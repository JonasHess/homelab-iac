# External configuration chart (opt-in, leave repoURL empty to disable)
externalConfig:
  repoURL: ""
  targetRevision: "main"
  path: ""
  configMapName: "homeassistant-app-config"

generic:
  configMaps:
    homeassistant-config-map:
      TZ: "Europe/Berlin"
  deployment:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    # Requests only, sized from measured usage, so this pod is among the last
    # to be evicted under memory pressure. No limit: a too-tight one kills the app, and the node has ample headroom.
    resources:
      requests:
        memory: "1Gi"
        cpu: "50m"
    ports:
      - containerPort: 8123
    pvcMounts:
      config:
        mountPath: /config
        hostPath:   # /mnt/somewhere/unencrypted/apps/homeassistant/config
        backup:
          enabled: true
    envFrom:
      configMapRef: homeassistant-config-map
  service:
    ports:
      - name: http
        port: 8123
  ingress:
    https:
      - subdomain: homeassistant
        port: 8123
        oauth: true
    # Routes that skip the gateway OIDC login; Home Assistant's own login is
    # the only protection here, so keep MFA enabled for every HA user.
    # - pathPrefixes: REST/websocket API, the HA login flow and frontend assets,
    #   used by the companion apps and API clients that authenticate with HA tokens.
    # - rawMatch: the Android companion app renders the UI in a WebView, whose
    #   User-Agent contains "wv". This match has no path, so it applies to EVERY
    #   path, and it outranks the OIDC route above because header matches win
    #   ties. The User-Agent is client-controlled, so any client can use it to
    #   skip OIDC. Removing it makes the Android app's UI hit the OIDC login.
      - subdomain: homeassistant
        port: 8123
        pathPrefixes:
          - /api
          - /auth
          - /frontend_latest
          - /static
        rawMatch:
          - headers:
              - name: User-Agent
                type: RegularExpression
                value: ".*wv.*"
        oauth: false
